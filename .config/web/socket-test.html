<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flyflor Socket Test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef1f5;
        color: #17202a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      button,
      input,
      textarea {
        border: 1px solid #bbc6d2;
        border-radius: 6px;
        font: inherit;
      }

      button {
        height: 36px;
        padding: 0 14px;
        background: #145ea8;
        color: #ffffff;
        border-color: #145ea8;
        cursor: pointer;
        font-weight: 650;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      input {
        height: 36px;
        min-width: 0;
        padding: 0 10px;
        background: #ffffff;
      }

      textarea {
        width: 100%;
        min-height: 58px;
        max-height: 180px;
        padding: 10px 12px;
        resize: vertical;
        background: #ffffff;
        line-height: 1.45;
      }

      .app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100vh;
        min-height: 0;
      }

      .toolbar {
        display: grid;
        grid-template-columns: auto minmax(220px, 1fr) minmax(160px, 240px) auto;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        background: #ffffff;
        border-bottom: 1px solid #d7dee8;
      }

      .status {
        min-width: 82px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #e7ebf0;
        color: #536171;
        font-size: 12px;
        font-weight: 750;
        text-transform: uppercase;
      }

      .status.online {
        background: #dff3e7;
        color: #126235;
      }

      .status.error {
        background: #ffe4e1;
        color: #9a251d;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 40vw);
        min-height: 0;
      }

      .chat-pane,
      .signals-pane {
        min-width: 0;
        min-height: 0;
      }

      .chat-pane {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        background: #f7f8fa;
      }

      /* ---- Signal panels ---- */

      .signals-pane {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background: #101821;
        color: #d9e2ec;
        border-left: 1px solid #0b1118;
      }

      .signals-tabs {
        display: flex;
        overflow-x: auto;
        border-bottom: 1px solid #243242;
        background: #151f2b;
        flex-shrink: 0;
      }

      .signals-tab-btn {
        flex-shrink: 0;
        height: 36px;
        padding: 0 14px;
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        border-radius: 0;
        color: #889bb0;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition: color 0.15s;
      }

      .signals-tab-btn:hover {
        color: #c8d3df;
      }

      .signals-tab-btn.active {
        color: #ffffff;
        border-bottom-color: #5b92cf;
      }

      .signals-tab-content {
        overflow: auto;
        min-height: 0;
        padding: 10px;
      }

      .signals-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .signals-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 750;
        color: #d9e2ec;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .signals-header .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: #243242;
        color: #9ec5ff;
        font-size: 11px;
        font-weight: 750;
        line-height: 1;
      }

      .signals-header button {
        height: 26px;
        padding: 0 10px;
        background: #223044;
        border-color: #304157;
        color: #d9e2ec;
        font-size: 11px;
      }

      .signal-event {
        margin-bottom: 8px;
        padding: 8px 10px;
        border: 1px solid #243242;
        border-radius: 6px;
        background: #151f2b;
      }

      .signal-event-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 4px;
      }

      .signal-event-type {
        font-weight: 750;
        font-size: 12px;
        color: #9ec5ff;
      }

      .signal-event-time {
        font-size: 11px;
        color: #6b8199;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .signal-event-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 4px;
      }

      .signal-event-meta .tag {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        background: #1e2d3d;
        color: #b6c4d2;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .signal-event pre {
        margin: 0;
        font-size: 11px;
        color: #889bb0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        max-height: 120px;
        overflow-y: auto;
      }

      .empty-state {
        text-align: center;
        padding: 32px 16px;
        color: #5a6e82;
        font-size: 13px;
      }

      /* ---- System panel ---- */

      .system-grid {
        display: grid;
        gap: 10px;
      }

      .system-card {
        padding: 12px;
        border: 1px solid #243242;
        border-radius: 8px;
        background: #151f2b;
      }

      .system-card h4 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 750;
        color: #889bb0;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .system-card .value {
        font-size: 22px;
        font-weight: 750;
        color: #ffffff;
      }

      .system-card .value.active-state {
        color: #44c27d;
      }

      .system-card .value.inactive-state {
        color: #dc6a5e;
      }

      .system-card .detail {
        margin-top: 4px;
        font-size: 12px;
        color: #6b8199;
      }

      .eq-weights {
        display: grid;
        gap: 6px;
      }

      .eq-weight-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .eq-weight-label {
        font-size: 12px;
        color: #b6c4d2;
      }

      .eq-weight-bar-bg {
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: #243242;
        overflow: hidden;
      }

      .eq-weight-bar-fill {
        height: 100%;
        border-radius: 4px;
        background: #5b92cf;
        transition: width 0.3s;
      }

      .eq-weight-value {
        font-size: 12px;
        color: #9ec5ff;
        font-weight: 650;
        min-width: 36px;
        text-align: right;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      /* ---- Chat log ---- */

      .chat-log {
        padding: 18px;
        overflow: auto;
        min-height: 0;
      }

      .message-row {
        display: flex;
        margin: 0 0 12px;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.assistant,
      .message-row.error {
        justify-content: flex-start;
      }

      .bubble {
        max-width: min(760px, 78%);
        padding: 10px 12px;
        border: 1px solid #d3dbe5;
        border-radius: 8px;
        background: #ffffff;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .message-row.user .bubble {
        background: #145ea8;
        border-color: #145ea8;
        color: #ffffff;
      }

      .message-row.error .bubble {
        background: #fff1ef;
        border-color: #f3b8b1;
        color: #8f241c;
      }

      .composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: end;
        padding: 12px;
        background: #ffffff;
        border-top: 1px solid #d7dee8;
      }

      @media (max-width: 900px) {
        .toolbar {
          grid-template-columns: auto minmax(0, 1fr);
        }

        #conversation,
        #connect {
          grid-column: span 1;
        }

        .workspace {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) minmax(280px, 36vh);
        }

        .signals-pane {
          border-left: 0;
          border-top: 1px solid #0b1118;
        }

        .bubble {
          max-width: 88%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="toolbar">
        <span class="status" id="status">offline</span>
        <input id="url" aria-label="WebSocket URL" autocomplete="off" />
        <input id="conversation" aria-label="Conversation id" autocomplete="off" value="local-test" />
        <button id="connect" type="button">Connect</button>
      </header>
      <section class="workspace">
        <section class="chat-pane" aria-label="Conversation">
          <div class="chat-log" id="chat-log" aria-live="polite"></div>
          <form class="composer" id="form">
            <textarea id="message" aria-label="Message" autofocus></textarea>
            <button id="send" type="submit">Send</button>
          </form>
        </section>
        <aside class="signals-pane" aria-label="Signals">
          <nav class="signals-tabs" id="signals-tabs">
            <button class="signals-tab-btn active" data-panel="worker">Worker</button>
            <button class="signals-tab-btn" data-panel="sandbox">Sandbox</button>
            <button class="signals-tab-btn" data-panel="scope">Scope</button>
            <button class="signals-tab-btn" data-panel="crystal">Crystal</button>
            <button class="signals-tab-btn" data-panel="forgetting">Forgetting</button>
            <button class="signals-tab-btn" data-panel="system">System</button>
          </nav>
          <div class="signals-tab-content" id="signals-content"></div>
        </aside>
      </section>
    </main>
    <script>
      /* ---- DOM refs ---- */

      const statusEl = document.querySelector("#status");
      const urlEl = document.querySelector("#url");
      const chatLogEl = document.querySelector("#chat-log");
      const signalsContentEl = document.querySelector("#signals-content");
      const signalsTabsEl = document.querySelector("#signals-tabs");
      const connectEl = document.querySelector("#connect");
      const formEl = document.querySelector("#form");
      const conversationEl = document.querySelector("#conversation");
      const messageEl = document.querySelector("#message");
      const sendEl = document.querySelector("#send");

      const assistantByTurn = new Map();
      const staticDefaultWsUrl = "ws://127.0.0.1:17361/ws";

      let activePanel = "worker";
      const debugCategories = ["chat", "tool", "memory", "context", "model", "recovery", "workmux", "plugin", "socket", "error", "worker", "sandbox", "scope", "crystal", "forgetting", "system"];
      let socket;
      let inFlight = false;

      /* ---- Signal panel state ---- */

      const panelDefs = [
        { id: "worker",    label: "Worker",     prefix: "worker." },
        { id: "sandbox",   label: "Sandbox",    prefix: "sandbox." },
        { id: "scope",     label: "Scope",      prefix: "scope." },
        { id: "crystal",   label: "Crystal",    prefix: "crystal." },
        { id: "forgetting",label: "Forgetting", prefix: "forgetting." },
      ];

      // Ring buffer — last 10 events per signal panel
      const signalEvents = new Map();
      for (const def of panelDefs) {
        signalEvents.set(def.id, []);
      }

      // System status derived from incoming signals
      const systemStatus = {
        activeWorkers: 0,
        scopeActive: false,
        scopeRecallMode: false,
        eqWeights: {},
      };

      /* ---- Helpers ---- */

      urlEl.value = defaultWebSocketUrl();

      function setStatus(status) {
        statusEl.textContent = status;
        statusEl.className = `status ${status === "online" || status === "error" ? status : ""}`.trim();
        sendEl.disabled = status !== "online" || inFlight;
      }

      function defaultWebSocketUrl() {
        if (location.protocol === "file:" || !location.host) {
          return staticDefaultWsUrl;
        }
        const protocol = location.protocol === "https:" ? "wss" : "ws";
        return `${protocol}://${location.host}/ws`;
      }

      function createEnvelopeId() {
        if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") {
          return globalThis.crypto.randomUUID();
        }
        const random = Math.random().toString(16).slice(2);
        return `local-${Date.now().toString(36)}-${random}`;
      }

      /* ---- Panel routing ---- */

      function panelForType(type) {
        for (const def of panelDefs) {
          if (type.startsWith(def.prefix)) return def.id;
        }
        return null;
      }

      function pushSignalEvent(panelId, type, payload) {
        const events = signalEvents.get(panelId);
        if (!events) return;
        events.push({ type, payload, time: new Date().toLocaleTimeString() });
        while (events.length > 10) events.shift();
      }

      /* ---- System status derived from signals ---- */

      function updateSystemStatus(type, payload) {
        const data = payload || {};

        // Worker counts
        if (type === "worker.spawn" || type === "worker.started" || type === "worker.queued") {
          systemStatus.activeWorkers += 1;
        }
        if (type === "worker.completed" || type === "worker.failed") {
          systemStatus.activeWorkers = Math.max(0, systemStatus.activeWorkers - 1);
        }

        // Scope state
        if (type === "scope.activated") systemStatus.scopeActive = true;
        if (type === "scope.deactivated") systemStatus.scopeActive = false;
        if (type === "scope.recall_mode.started") systemStatus.scopeRecallMode = true;
        if (type === "scope.recall_mode.ended") systemStatus.scopeRecallMode = false;

        // EQ weights — look in payload for weight-like keys
        if (data.eqWeights && typeof data.eqWeights === "object") {
          Object.assign(systemStatus.eqWeights, data.eqWeights);
        }
        if (data.weights && typeof data.weights === "object") {
          Object.assign(systemStatus.eqWeights, data.weights);
        }
        // crystal.gem.elevated/loaded may carry weight info
        if ((type === "crystal.gem.elevated" || type === "crystal.gem.loaded") && data.weight !== undefined) {
          systemStatus.eqWeights[data.name || data.id || "gem"] = data.weight;
        }
      }

      /* ---- Rendering ---- */

      function renderActivePanel() {
        signalsContentEl.innerHTML = "";
        if (activePanel === "system") {
          renderSystemPanel();
          return;
        }
        const events = signalEvents.get(activePanel) || [];
        const def = panelDefs.find(d => d.id === activePanel);
        const label = def ? def.label : activePanel;

        const header = document.createElement("div");
        header.className = "signals-header";
        const h3 = document.createElement("h3");
        h3.textContent = label;
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = events.length;
        const clearBtn = document.createElement("button");
        clearBtn.type = "button";
        clearBtn.textContent = "Clear";
        clearBtn.addEventListener("click", () => {
          signalEvents.set(activePanel, []);
          if (activePanel === "worker") systemStatus.activeWorkers = 0;
          renderActivePanel();
        });
        header.append(h3, badge, clearBtn);
        signalsContentEl.append(header);

        if (events.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "No events yet";
          signalsContentEl.append(empty);
          return;
        }

        for (const evt of events.slice().reverse()) {
          signalsContentEl.append(buildSignalEventEl(evt));
        }
      }

      function buildSignalEventEl(evt) {
        const el = document.createElement("div");
        el.className = "signal-event";

        const header = document.createElement("div");
        header.className = "signal-event-header";
        const typeSpan = document.createElement("span");
        typeSpan.className = "signal-event-type";
        typeSpan.textContent = evt.type;
        const timeSpan = document.createElement("span");
        timeSpan.className = "signal-event-time";
        timeSpan.textContent = evt.time;
        header.append(typeSpan, timeSpan);

        const meta = document.createElement("div");
        meta.className = "signal-event-meta";
        const tags = summarizeTags(evt.payload);
        for (const tag of tags) {
          const tagEl = document.createElement("span");
          tagEl.className = "tag";
          tagEl.textContent = tag;
          meta.append(tagEl);
        }

        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(evt.payload, null, 2);

        el.append(header, meta, pre);
        return el;
      }

      function summarizeTags(payload) {
        const tags = [];
        const data = payload || {};
        if (data.workerId) tags.push(`worker=${data.workerId}`);
        if (data.id) tags.push(`id=${data.id}`);
        if (data.name) tags.push(`name=${data.name}`);
        if (data.status) tags.push(`status=${data.status}`);
        if (data.reason) tags.push(`reason=${data.reason}`);
        if (data.conversationId) tags.push(`conv=${data.conversationId}`);
        return tags.length > 0 ? tags : ["raw"];
      }

      function renderSystemPanel() {
        const grid = document.createElement("div");
        grid.className = "system-grid";

        // Active workers
        const workerCard = document.createElement("div");
        workerCard.className = "system-card";
        workerCard.innerHTML = `<h4>Active Workers</h4>
          <div class="value">${systemStatus.activeWorkers}</div>
          <div class="detail">tracked from spawn / started / completed / failed</div>`;
        grid.append(workerCard);

        // Scope state
        const scopeCard = document.createElement("div");
        scopeCard.className = "system-card";
        const scopeClass = systemStatus.scopeActive ? "active-state" : "inactive-state";
        const scopeLabel = systemStatus.scopeActive ? "Active" : "Inactive";
        const recallInfo = systemStatus.scopeRecallMode ? " (recall mode)" : "";
        scopeCard.innerHTML = `<h4>Scope Activation</h4>
          <div class="value ${scopeClass}">${scopeLabel}${recallInfo}</div>
          <div class="detail">updated from scope.activated / scope.deactivated</div>`;
        grid.append(scopeCard);

        // EQ weights
        const eqCard = document.createElement("div");
        eqCard.className = "system-card";
        const eqTitle = document.createElement("h4");
        eqTitle.textContent = "EQ Weights";
        eqCard.append(eqTitle);

        const weights = systemStatus.eqWeights;
        const weightKeys = Object.keys(weights);
        if (weightKeys.length === 0) {
          const noData = document.createElement("div");
          noData.className = "detail";
          noData.textContent = "No EQ weights received yet";
          eqCard.append(noData);
        } else {
          const eqList = document.createElement("div");
          eqList.className = "eq-weights";
          for (const key of weightKeys) {
            const row = document.createElement("div");
            row.className = "eq-weight-row";
            const label = document.createElement("span");
            label.className = "eq-weight-label";
            label.textContent = key;
            const barBg = document.createElement("div");
            barBg.className = "eq-weight-bar-bg";
            const barFill = document.createElement("div");
            barFill.className = "eq-weight-bar-fill";
            const pct = Math.min(100, Math.max(0, Number(weights[key]) * 100 || 0));
            barFill.style.width = `${pct}%`;
            barBg.append(barFill);
            const val = document.createElement("span");
            val.className = "eq-weight-value";
            val.textContent = typeof weights[key] === "number" ? weights[key].toFixed(3) : String(weights[key]);
            row.append(label, barBg, val);
            eqList.append(row);
          }
          eqCard.append(eqList);
        }
        grid.append(eqCard);

        // Connection info
        const connCard = document.createElement("div");
        connCard.className = "system-card";
        connCard.innerHTML = `<h4>Connection</h4>
          <div class="detail" style="font-size:13px;color:#b6c4d2;">${urlEl.value}</div>`;
        grid.append(connCard);

        signalsContentEl.append(grid);
      }

      /* ---- Tab switching ---- */

      signalsTabsEl.addEventListener("click", (event) => {
        const btn = event.target.closest(".signals-tab-btn");
        if (!btn) return;
        activePanel = btn.dataset.panel;
        for (const b of signalsTabsEl.querySelectorAll(".signals-tab-btn")) {
          b.classList.toggle("active", b === btn);
        }
        renderActivePanel();
      });

      /* ---- Chat handling ---- */

      function appendChatMessage(role, content) {
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;
        row.append(bubble);
        chatLogEl.append(row);
        chatLogEl.scrollTop = chatLogEl.scrollHeight;
        return bubble;
      }

      function assistantBubble(turnId) {
        const pending = assistantByTurn.get("pending");
        if (pending && turnId && !assistantByTurn.has(turnId)) {
          assistantByTurn.delete("pending");
          assistantByTurn.set(turnId, pending);
          return pending;
        }
        if (turnId && assistantByTurn.has(turnId)) {
          return assistantByTurn.get(turnId);
        }
        const bubble = appendChatMessage("assistant", "");
        assistantByTurn.set(turnId || "pending", bubble);
        return bubble;
      }

      /* ---- Envelope handling ---- */

      function handleEnvelope(envelope) {
        const type = envelope.type;
        const payload = envelope.payload || {};

        // Route to signal panels
        const panelId = panelForType(type);
        if (panelId) {
          pushSignalEvent(panelId, type, payload);
          updateSystemStatus(type, payload);
          // Re-render if this panel is currently active (or system panel)
          if (activePanel === panelId || activePanel === "system") {
            renderActivePanel();
          }
          return;
        }

        // Chat events (existing behaviour)
        if (type === "chat.delta") {
          const bubble = assistantBubble(payload?.turnId);
          bubble.textContent += payload?.delta ?? "";
          chatLogEl.scrollTop = chatLogEl.scrollHeight;
          return;
        }
        if (type === "chat.final") {
          const bubble = assistantBubble(payload?.turnId);
          bubble.textContent = payload?.content ?? "";
          inFlight = false;
          setStatus(socket?.readyState === WebSocket.OPEN ? "online" : "offline");
          return;
        }
        if (type === "chat.turn.complete") {
          inFlight = false;
          setStatus(socket?.readyState === WebSocket.OPEN ? "online" : "offline");
          return;
        }
        if (type === "agent.error") {
          const pending = assistantByTurn.get("pending");
          if (pending) {
            pending.parentElement.className = "message-row error";
            pending.textContent = payload?.error ?? "agent error";
            assistantByTurn.delete("pending");
          } else {
            appendChatMessage("error", payload?.error ?? "agent error");
          }
          inFlight = false;
          setStatus("error");
        }
      }

      /* ---- WebSocket ---- */

      function connect() {
        socket?.close();
        socket = new WebSocket(urlEl.value);
        inFlight = false;
        setStatus("connecting");
        socket.addEventListener("open", () => {
          setStatus("online");
        });
        socket.addEventListener("message", (event) => {
          handleEnvelope(JSON.parse(event.data));
        });
        socket.addEventListener("close", () => {
          inFlight = false;
          setStatus("offline");
        });
        socket.addEventListener("error", () => {
          inFlight = false;
          setStatus("error");
        });
      }

      /* ---- Event listeners ---- */

      connectEl.addEventListener("click", connect);

      messageEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          if (typeof formEl.requestSubmit === "function") {
            formEl.requestSubmit();
          } else {
            sendEl.click();
          }
        }
      });

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const content = messageEl.value;
        if (!content) return;
        if (socket?.readyState !== WebSocket.OPEN) {
          pushSignalEvent("system", "client.send.blocked", { reason: "socket-not-open" });
          renderActivePanel();
          return;
        }
        if (inFlight) {
          pushSignalEvent("system", "client.send.blocked", { reason: "turn-in-flight" });
          renderActivePanel();
          return;
        }
        const envelope = {
          id: createEnvelopeId(),
          type: "chat.message",
          payload: {
            conversationId: conversationEl.value,
            content,
          },
          timestamp: Date.now(),
        };
        socket.send(JSON.stringify(envelope));
        appendChatMessage("user", content);
        assistantByTurn.set("pending", appendChatMessage("assistant", ""));
        messageEl.value = "";
        inFlight = true;
        setStatus("online");
      });

      /* ---- Init ---- */

      renderActivePanel();
      connect();
    </script>
  </body>
</html>
