name: flyflor

services:
    flyflor:
        image: debian:bookworm-slim
        container_name: flyflor-dev
        working_dir: /workspace
        entrypoint: ["/bin/sh", "/workspace/docker/entrypoint.sh"]
        command: ["gateway"]
        volumes:
            - .:/workspace
            - ./docker/config:/root/.flyflor
            - ./docker/storage/flyflor:/root/.local/share/flyflor
            - ./dist/flyflor-linux:/mounted/flyflor-linux:ro
        ports:
            - "18790:18790"
        depends_on:
            qdrant:
                condition: service_started
            surrealdb:
                condition: service_started
        stdin_open: true
        tty: true

    qdrant:
        image: qdrant/qdrant:latest
        container_name: flyflor-qdrant
        volumes:
            - ./docker/storage/qdrant:/qdrant/storage
        expose:
            - "6333"

    surrealdb:
        image: surrealdb/surrealdb:latest
        container_name: flyflor-surrealdb
        command: start --user root --pass root rocksdb:/data/flyflor.db
        volumes:
            - ./docker/storage/surrealdb:/data
        expose:
            - "8000"
