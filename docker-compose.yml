name: flyflor

# Flyflor local dev compose.
#
# Default dev now runs as a single Flyflor container: working memory uses the
# local WAL-backed MemoryComponent and crystal storage is optional. Redis and
# SurrealDB can still be added through a local docker-compose.override.yml when
# testing external backends, but they are no longer part of the baseline stack.

networks:
    flyflor-internal:
        driver: bridge
        internal: false
        # Keep outbound access for LLM/MCP providers while publishing no host ports.

volumes:
    flyflor_data:

services:
    flyflor:
        image: debian:bookworm-slim
        container_name: flyflor-dev
        restart: unless-stopped
        working_dir: /root/.flyflor/.config/workspace
        entrypoint: ["/bin/sh", "/root/.flyflor/docker/entrypoint.sh"]
        command: ["socket"]
        # Dev mounts are explicit and stable: source tree, JSONC config,
        # workspace, global skills/MCP dirs, local durable data, and binary.
        volumes:
            - .:/root/.flyflor
            - ./docker/config:/root/.flyflor/.config
            - ./docker/workspace:/root/.flyflor/.config/workspace
            - ./docker/skills:/root/.flyflor/.config/skills
            - ./docker/mcp:/root/.flyflor/.config/mcp
            - flyflor_data:/root/.local/share/flyflor
            - ./dist/flyflor-linux:/mounted/flyflor-linux:ro
        networks:
            - flyflor-internal
        stdin_open: true
        tty: true
        # Intentionally no ports. Use docker-compose.override.yml locally when
        # host-side gateway debugging needs a temporary published port.
