<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Flyflor 对话测试</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #0b1016;
                color: #d7dde7;
                padding: 2rem 1.25rem;
            }
            .container {
                max-width: 960px;
                margin: 0 auto;
            }
            .header {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 1rem;
                margin-bottom: 1rem;
            }
            .title-wrap {
                min-width: 0;
            }
            h1 {
                font-size: 1.75rem;
                margin-bottom: 0.4rem;
                color: #e8eef7;
                font-weight: 650;
            }
            .subtitle {
                color: #93a1b5;
                font-size: 0.95rem;
                line-height: 1.5;
            }
            .status {
                display: inline-flex;
                align-items: center;
                gap: 0.65rem;
                min-width: 196px;
                padding: 0.8rem 0.95rem;
                border-radius: 10px;
                border: 1px solid #233142;
                background: #101722;
                color: #c9d5e4;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            }
            .status-dot {
                width: 0.7rem;
                height: 0.7rem;
                border-radius: 999px;
                background: #f85149;
                box-shadow: 0 0 0 4px rgba(248, 81, 73, 0.15);
            }
            .status-label {
                display: block;
                color: #8ea0b5;
                font-size: 0.78rem;
                margin-bottom: 0.15rem;
            }
            .status.connected {
                background: #0f1a17;
                border-color: #1d5142;
            }
            .status.connected .status-dot {
                background: #2ea043;
                box-shadow: 0 0 0 4px rgba(46, 160, 67, 0.15);
            }
            .status.disconnected {
                background: #1a1113;
                border-color: #5a262b;
            }
            .controls {
                display: flex;
                gap: 0.5rem;
                margin: 0 0 1rem;
                flex-wrap: wrap;
            }
            button {
                padding: 0.65rem 1rem;
                border: 1px solid #2a3747;
                border-radius: 8px;
                background: #151d27;
                color: #d7dde7;
                cursor: pointer;
                font-size: 0.9rem;
                transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
            }
            button:hover {
                background: #1c2633;
                border-color: #3a4b60;
                transform: translateY(-1px);
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }
            .chat {
                background: #0f151d;
                border: 1px solid #202c3a;
                border-radius: 12px;
                padding: 1rem;
                height: 540px;
                overflow-y: auto;
                margin-bottom: 1rem;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
            }
            .message {
                padding: 0.8rem 0.95rem;
                margin: 0.65rem 0;
                border-radius: 10px;
                max-width: 84%;
                line-height: 1.55;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .message.user {
                background: #132030;
                border-left: 3px solid #4d8dff;
                margin-left: auto;
            }
            .message.agent {
                background: #121c19;
                border-left: 3px solid #2ea043;
            }
            .message.error {
                background: #2a1517;
                border-left: 3px solid #f85149;
            }
            .message.system {
                background: #161e29;
                border-left: 3px solid #66778f;
                color: #9fb0c5;
                max-width: 100%;
            }
            .message.pending::after {
                content: '';
                display: inline-block;
                width: 0.5rem;
                height: 0.5rem;
                margin-left: 0.5rem;
                border-radius: 999px;
                background: #2ea043;
                animation: pulse 1s ease-in-out infinite;
            }
            .input-row {
                display: flex;
                gap: 0.5rem;
            }
            input[type='text'] {
                flex: 1;
                padding: 0.75rem;
                border: 1px solid #2a3747;
                border-radius: 10px;
                background: #101722;
                color: #d7dde7;
                font-size: 1rem;
            }
            input[type='text']:focus {
                outline: none;
                border-color: #4d8dff;
                box-shadow: 0 0 0 3px rgba(77, 141, 255, 0.14);
            }
            .quick-actions {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 1rem;
                flex-wrap: wrap;
                align-items: center;
            }
            .quick-btn {
                padding: 0.55rem 0.8rem;
                background: #101722;
                border: 1px solid #243243;
                border-radius: 999px;
                color: #97a8bc;
                font-size: 0.85rem;
            }
            .quick-btn:hover {
                background: #162130;
                color: #d7dde7;
            }
            .chat-empty {
                color: #708197;
                padding: 0.4rem 0.2rem 0.8rem;
                font-size: 0.92rem;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.35;
                    transform: scale(0.9);
                }
                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="title-wrap">
                    <h1>Flyflor 对话测试</h1>
                    <p class="subtitle">通过 WebSocket bridge 连接本地 IPC，观察逐段流式输出与协议兼容行为。</p>
                </div>
                <div id="status" class="status disconnected">
                    <span class="status-dot"></span>
                    <div>
                        <span class="status-label">连接状态</span>
                        <span id="statusText">未连接</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="connectBtn">连接</button>
                <button id="disconnectBtn" disabled>断开</button>
                <button id="clearBtn" disabled>清空对话</button>
            </div>

            <div class="quick-actions" id="quickActions" style="display: none">
                <span style="color: #8b949e; font-size: 0.85rem">快速测试：</span>
                <button class="quick-btn" data-msg="你好">你好</button>
                <button class="quick-btn" data-msg="显示上下文">显示上下文</button>
                <button class="quick-btn" data-msg="帮我写代码">帮我写代码</button>
                <button class="quick-btn" data-msg="解释 Flyflor 架构">解释架构</button>
            </div>
            <div class="chat" id="chat">
                <div class="chat-empty" id="chatEmpty">连接后发送一条消息，Flyflor 的增量输出会实时追加到同一条回复里。</div>
            </div>

            <div class="input-row">
                <input type="text" id="messageInput" placeholder="输入消息..." disabled />
                <button id="sendBtn" disabled>发送</button>
            </div>
        </div>

        <script>
            let ws = null;
            let pending = false;
            let currentAgentMessage = null;
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const chat = document.getElementById('chat');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const clearBtn = document.getElementById('clearBtn');
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');
            const quickActions = document.getElementById('quickActions');
            const chatEmpty = document.getElementById('chatEmpty');

            function addMessage(content, type) {
                if (chatEmpty) chatEmpty.remove();
                const msg = document.createElement('div');
                msg.className = `message ${type}`;
                msg.textContent = content;
                chat.appendChild(msg);
                chat.scrollTop = chat.scrollHeight;
                return msg;
            }

            function createPendingAgentMessage() {
                if (!currentAgentMessage) {
                    currentAgentMessage = addMessage('', 'agent');
                }
                currentAgentMessage.classList.add('pending');
                return currentAgentMessage;
            }

            function appendAgentDelta(content) {
                createPendingAgentMessage();
                currentAgentMessage.textContent += content;
                chat.scrollTop = chat.scrollHeight;
            }

            function finishAgentStream() {
                if (currentAgentMessage && currentAgentMessage.textContent.trim().length === 0) {
                    currentAgentMessage.remove();
                } else if (currentAgentMessage) {
                    currentAgentMessage.classList.remove('pending');
                }
                pending = false;
                currentAgentMessage = null;
                setInputEnabled(ws && ws.readyState === WebSocket.OPEN);
                messageInput.focus();
            }

            function setInputEnabled(enabled) {
                sendBtn.disabled = !enabled;
                messageInput.disabled = !enabled;
                document.querySelectorAll('.quick-btn').forEach((btn) => {
                    btn.disabled = !enabled;
                });
            }

            function sendUserMessage(text) {
                if (!text || !ws || pending) return;
                const payload = { action: 'user', data: text };
                pending = true;
                setInputEnabled(false);
                ws.send(JSON.stringify(payload));
                addMessage(text, 'user');
                createPendingAgentMessage();
            }

            connectBtn.onclick = () => {
                ws = new WebSocket('ws://127.0.0.1:17878');

                ws.onopen = () => {
                    status.className = 'status connected';
                    statusText.textContent = '已连接 (ws://127.0.0.1:17878)';
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    clearBtn.disabled = false;
                    setInputEnabled(true);
                    quickActions.style.display = 'flex';
                    addMessage('WebSocket 已连接，等待欢迎消息...', 'system');
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.action === 'data') {
                            appendAgentDelta(String(msg.data ?? ''));
                        } else if (msg.action === 'streamEnd') {
                            finishAgentStream();
                        } else if (msg.action === 'agent') {
                            appendAgentDelta(String(msg.data ?? ''));
                            finishAgentStream();
                        } else if (msg.action === 'error') {
                            if (currentAgentMessage && currentAgentMessage.textContent.trim().length === 0) {
                                currentAgentMessage.remove();
                            } else if (currentAgentMessage) {
                                currentAgentMessage.classList.remove('pending');
                            }
                            pending = false;
                            currentAgentMessage = null;
                            setInputEnabled(ws && ws.readyState === WebSocket.OPEN);
                            addMessage('错误: ' + msg.data, 'error');
                        } else if (msg.action === 'open') {
                            addMessage('内核 IPC 已连接', 'system');
                        } else {
                            addMessage('收到: ' + event.data, 'system');
                        }
                    } catch (e) {
                        addMessage('解析错误: ' + event.data, 'system');
                    }
                };

                ws.onclose = () => {
                    status.className = 'status disconnected';
                    statusText.textContent = '未连接';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    clearBtn.disabled = true;
                    pending = false;
                    currentAgentMessage = null;
                    setInputEnabled(false);
                    quickActions.style.display = 'none';
                    addMessage('WebSocket 已断开', 'system');
                    ws = null;
                };

                ws.onerror = (err) => {
                    addMessage(`连接错误: ${err.message || 'WebSocket error'}`, 'error');
                };
            };

            disconnectBtn.onclick = () => {
                if (ws) ws.close();
            };

            clearBtn.onclick = () => {
                chat.innerHTML = '';
                currentAgentMessage = null;
                chat.innerHTML = '<div class="chat-empty" id="chatEmpty">连接后发送一条消息，Flyflor 的增量输出会实时追加到同一条回复里。</div>';
            };

            sendBtn.onclick = () => {
                const text = messageInput.value.trim();
                if (text) {
                    sendUserMessage(text);
                    messageInput.value = '';
                }
            };

            messageInput.onkeydown = (e) => {
                if (e.key === 'Enter' && !sendBtn.disabled) {
                    sendBtn.click();
                }
            };

            // 快速按钮
            document.querySelectorAll('.quick-btn').forEach((btn) => {
                btn.onclick = () => {
                    const msg = btn.getAttribute('data-msg');
                    sendUserMessage(msg);
                };
            });
        </script>
    </body>
</html>
