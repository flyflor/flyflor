<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyflor IPC 测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 2rem;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: #58a6ff; }
        .status {
            padding: 0.75rem;
            border-radius: 6px;
            margin: 1rem 0;
            border: 1px solid #30363d;
        }
        .status.connected { background: #0d4429; border-color: #2ea043; }
        .status.disconnected { background: #3d1818; border-color: #f85149; }
        .controls { display: flex; gap: 0.5rem; margin: 1rem 0; }
        button {
            padding: 0.5rem 1rem;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #21262d;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button:hover { background: #30363d; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .messages {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 1rem;
            height: 400px;
            overflow-y: auto;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 0.85rem;
        }
        .msg { padding: 0.25rem 0; border-bottom: 1px solid #21262d; }
        .msg.tx { color: #79c0ff; }
        .msg.rx { color: #a5d6ff; }
        .msg.sys { color: #8b949e; font-style: italic; }
        input[type="text"] {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
            color: #c9d1d9;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flyflor IPC 测试面板</h1>
        <p style="color: #8b949e; margin-bottom: 1rem;">连接到 Flyflor 内核 WebSocket (TCP 17878 fallback for macOS unix socket)</p>

        <div id="status" class="status disconnected">
            状态：<span id="statusText">未连接</span>
        </div>

        <div class="controls">
            <button id="connectBtn">连接</button>
            <button id="disconnectBtn" disabled>断开</button>
            <input type="text" id="messageInput" placeholder='输入 JSON 帧，例如 {"kind":"decision","topic":"test","payload":{}}' disabled>
            <button id="sendBtn" disabled>发送</button>
        </div>

        <div class="messages" id="messages"></div>
    </div>

    <script>
        let ws = null;
        const status = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const messages = document.getElementById('messages');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');

        function addMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `msg ${type}`;
            msg.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            messages.appendChild(msg);
            messages.scrollTop = messages.scrollHeight;
        }

        connectBtn.onclick = () => {
            // Unix socket not directly accessible from browser; use TCP fallback
            ws = new WebSocket('ws://127.0.0.1:17878');

            ws.onopen = () => {
                status.className = 'status connected';
                statusText.textContent = '已连接 (ws://127.0.0.1:17878)';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
                messageInput.disabled = false;
                addMessage('WebSocket 已连接', 'sys');
            };

            ws.onmessage = (event) => {
                addMessage(`← ${event.data}`, 'rx');
            };

            ws.onclose = () => {
                status.className = 'status disconnected';
                statusText.textContent = '未连接';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
                messageInput.disabled = true;
                addMessage('WebSocket 已断开', 'sys');
                ws = null;
            };

            ws.onerror = (err) => {
                addMessage(`错误: ${err.message || 'WebSocket error'}`, 'sys');
            };
        };

        disconnectBtn.onclick = () => {
            if (ws) ws.close();
        };

        sendBtn.onclick = () => {
            const text = messageInput.value.trim();
            if (!text || !ws) return;
            ws.send(text + '\n');
            addMessage(`→ ${text}`, 'tx');
            messageInput.value = '';
        };

        messageInput.onkeydown = (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendBtn.click();
            }
        };
    </script>
</body>
</html>
