<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="description" content="本地 IPC 对话测试页" />
        <meta name="theme-color" content="#0c0e0b" />
        <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310130d'/%3E%3Cpath d='M8 12h16M8 20h8' stroke='%23c7e18b' stroke-width='2.25' stroke-linecap='round'/%3E%3C/svg%3E" />
        <title>IPC 控制台</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #0c0e0b;
                --bg-soft: #11140f;
                --panel: #151812;
                --panel-soft: #1a1d17;
                --panel-strong: #20241d;
                --line: rgba(233, 230, 220, 0.11);
                --line-soft: rgba(233, 230, 220, 0.07);
                --text: #f3f0e7;
                --muted: #b4ae9e;
                --faint: #7f7a6c;
                --accent: #9ec875;
                --accent-strong: #c7e18b;
                --warning: #ddb55d;
                --danger: #df7b70;
                --shadow: rgba(0, 0, 0, 0.34);
                --shadow-soft: rgba(14, 16, 11, 0.6);
                --radius-xs: 0.35rem;
                --radius-sm: 0.5rem;
                --radius-md: 0.7rem;
                --radius-lg: 0.95rem;
                --mono: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
                --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            html {
                min-height: 100%;
                background: var(--bg);
                overflow: hidden;
                scroll-behavior: smooth;
            }

            body {
                min-height: 100dvh;
                margin: 0;
                overflow: hidden;
                font-family: var(--sans);
                color: var(--text);
                text-rendering: geometricPrecision;
                -webkit-font-smoothing: antialiased;
                background:
                    radial-gradient(circle at 14% 0%, rgba(158, 200, 117, 0.16), transparent 32rem),
                    radial-gradient(circle at 88% 100%, rgba(221, 181, 93, 0.08), transparent 24rem),
                    linear-gradient(180deg, rgba(255, 255, 255, 0.014), transparent 28%),
                    var(--bg);
            }

            body::before {
                position: fixed;
                inset: 0;
                pointer-events: none;
                content: "";
                opacity: 0.16;
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
                background-size: 3rem 3rem;
                mask-image: linear-gradient(to bottom, black, transparent 80%);
            }

            body::after {
                position: fixed;
                inset: 0;
                pointer-events: none;
                content: "";
                opacity: 0.05;
                mix-blend-mode: screen;
                background-image: radial-gradient(rgba(255, 255, 255, 0.28) 0.45px, transparent 0.45px);
                background-size: 1.65rem 1.65rem;
            }

            button,
            input {
                font: inherit;
            }

            button {
                min-height: 2.55rem;
                padding: 0.66rem 0.92rem;
                border: 1px solid var(--line);
                border-radius: var(--radius-sm);
                color: var(--text);
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.015)),
                    var(--panel-soft);
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
                cursor: pointer;
                transition:
                    transform 180ms ease,
                    border-color 180ms ease,
                    background-color 180ms ease,
                    color 180ms ease,
                    box-shadow 180ms ease;
            }

            button:hover:not(:disabled) {
                transform: translateY(-1px);
                border-color: rgba(193, 216, 143, 0.34);
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.042), rgba(255, 255, 255, 0.02)),
                    var(--panel-strong);
                box-shadow:
                    0 0.9rem 2rem rgba(0, 0, 0, 0.18),
                    inset 0 1px 0 rgba(255, 255, 255, 0.04);
            }

            button:active:not(:disabled) {
                transform: translateY(0) scale(0.99);
            }

            button:focus-visible,
            input:focus-visible {
                outline: 2px solid rgba(184, 217, 135, 0.72);
                outline-offset: 2px;
            }

            button:disabled,
            input:disabled {
                cursor: not-allowed;
                opacity: 0.46;
            }

            .skip-link {
                position: fixed;
                top: 0.85rem;
                left: 0.85rem;
                z-index: 2;
                padding: 0.55rem 0.75rem;
                border-radius: var(--radius-xs);
                color: #0e100c;
                background: var(--accent-strong);
                transform: translateY(-160%);
            }

            .skip-link:focus {
                transform: translateY(0);
            }

            .shell {
                width: min(88rem, calc(100% - 1.75rem));
                height: calc(100dvh - clamp(1.8rem, 2.8vw, 2.65rem));
                min-height: calc(100dvh - clamp(1.8rem, 2.8vw, 2.65rem));
                margin: 0 auto;
                padding: clamp(0.85rem, 1.4vw, 1.3rem) 0 clamp(0.95rem, 1.4vw, 1.35rem);
                display: grid;
                grid-template-rows: auto minmax(0, 1fr) auto;
                gap: clamp(0.8rem, 1.2vw, 1.1rem);
                overflow: hidden;
                position: relative;
            }

            .topbar {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(16rem, 20rem);
                grid-template-areas: "brand endpoint";
                gap: 1rem;
                align-items: end;
                padding: 0.1rem 0 0.9rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .brand {
                grid-area: brand;
                min-width: 0;
                display: grid;
                gap: 0.45rem;
            }

            .eyebrow {
                display: block;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--accent-strong);
                font-family: var(--mono);
                font-size: 0.72rem;
                font-variant-numeric: tabular-nums;
            }

            h1 {
                margin: 0;
                max-width: 12ch;
                font-size: clamp(2.15rem, 3.6vw, 4rem);
                line-height: 0.94;
                font-weight: 720;
                letter-spacing: -0.03em;
                text-wrap: balance;
            }

            .endpoint {
                grid-area: endpoint;
                justify-self: end;
                display: grid;
                gap: 0.3rem;
                width: min(100%, 20rem);
                padding: 0.8rem 0.9rem;
                border: 1px solid var(--line);
                border-radius: var(--radius-md);
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.016)),
                    rgba(21, 25, 18, 0.88);
                box-shadow: 0 1.15rem 2.8rem var(--shadow-soft);
                backdrop-filter: blur(16px) saturate(120%);
                -webkit-backdrop-filter: blur(16px) saturate(120%);
            }

            .endpoint span:first-child {
                color: var(--faint);
                font-size: 0.72rem;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                font-family: var(--mono);
            }

            .endpoint code {
                overflow: hidden;
                color: var(--text);
                font-family: var(--mono);
                font-size: 0.84rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .endpoint small {
                color: var(--faint);
                font-family: var(--mono);
                font-size: 0.72rem;
            }

            .workspace {
                min-height: 0;
                display: grid;
                grid-template-columns: minmax(0, 1.48fr) minmax(18.5rem, 0.82fr);
                grid-template-areas: "conversation side";
                gap: clamp(0.8rem, 1.2vw, 1rem);
                align-items: stretch;
            }

            .conversation {
                grid-area: conversation;
                min-width: 0;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.026), rgba(255, 255, 255, 0.012)),
                    rgba(20, 23, 17, 0.84);
                box-shadow:
                    0 1.35rem 3.8rem var(--shadow-soft),
                    inset 0 1px 0 rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(16px) saturate(112%);
                -webkit-backdrop-filter: blur(16px) saturate(112%);
            }

            .conversation {
                min-height: 0;
                display: grid;
                grid-template-rows: auto 1fr;
                overflow: hidden;
            }

            .conversation-head,
            .side-section {
                padding: 0.9rem 0.95rem;
                border-bottom: 1px solid var(--line-soft);
            }

            .conversation-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                background: rgba(255, 255, 255, 0.018);
            }

            .panel-title {
                margin: 0;
                color: var(--text);
                font-size: 0.86rem;
                font-weight: 650;
                letter-spacing: 0.01em;
            }

            .stream-state {
                display: inline-flex;
                align-items: center;
                gap: 0.42rem 0.55rem;
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.76rem;
                font-variant-numeric: tabular-nums;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .stream-dot {
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 50%;
                background: var(--faint);
            }

            .stream-state.active .stream-dot {
                background: var(--accent);
                box-shadow: 0 0 0 0.28rem rgba(158, 200, 117, 0.16);
                animation: pulse 1.1s ease-in-out infinite;
            }

            .signal-pill {
                display: inline-flex;
                align-items: center;
                min-height: 1.72rem;
                padding: 0.2rem 0.56rem;
                border: 1px solid rgba(199, 225, 139, 0.24);
                border-radius: 999px;
                color: var(--accent-strong);
                background: rgba(158, 200, 117, 0.08);
                font-family: var(--mono);
                font-size: 0.74rem;
                white-space: nowrap;
            }

            .chat {
                min-height: 0;
                padding: 1rem;
                overflow: auto;
                scrollbar-color: rgba(173, 177, 159, 0.72) transparent;
                scrollbar-gutter: stable;
            }

            .chat::-webkit-scrollbar,
            .debug-log::-webkit-scrollbar,
            .side::-webkit-scrollbar {
                width: 0.8rem;
                height: 0.8rem;
            }

            .chat::-webkit-scrollbar-thumb,
            .debug-log::-webkit-scrollbar-thumb,
            .side::-webkit-scrollbar-thumb {
                border: 0.23rem solid transparent;
                border-radius: 999px;
                background: rgba(132, 136, 124, 0.58);
                background-clip: content-box;
            }

            .chat::-webkit-scrollbar-track,
            .debug-log::-webkit-scrollbar-track,
            .side::-webkit-scrollbar-track {
                background: transparent;
            }

            .empty {
                min-height: 100%;
                display: grid;
                place-items: center;
                padding: 2rem;
                color: var(--muted);
                text-align: center;
            }

            .empty-inner {
                width: min(100%, 28rem);
                display: grid;
                gap: 0.8rem;
            }

            .empty-mark {
                width: 3.5rem;
                height: 3.5rem;
                margin: 0 auto;
                display: grid;
                place-items: center;
                border: 1px solid rgba(199, 225, 139, 0.22);
                border-radius: 0.8rem;
                color: var(--accent-strong);
                font-family: var(--mono);
                font-size: 1.3rem;
                background: rgba(158, 200, 117, 0.08);
            }

            .empty h2 {
                margin: 0;
                color: var(--text);
                font-size: 1.1rem;
            }

            .empty p {
                margin: 0;
                line-height: 1.7;
            }

            .message {
                position: relative;
                width: fit-content;
                max-width: min(44rem, 84%);
                margin: 0 0 0.8rem;
                padding: 0.82rem 0.92rem;
                border: 1px solid var(--line-soft);
                border-radius: 0.82rem;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
                box-shadow: 0 0.75rem 1.6rem rgba(0, 0, 0, 0.16);
                backdrop-filter: blur(12px) saturate(105%);
                -webkit-backdrop-filter: blur(12px) saturate(105%);
            }

            .message.user {
                margin-left: auto;
                border-color: rgba(221, 181, 93, 0.34);
                background:
                    linear-gradient(180deg, rgba(221, 181, 93, 0.16), rgba(221, 181, 93, 0.08)),
                    rgba(36, 30, 15, 0.74);
            }

            .message.agent {
                border-color: rgba(158, 200, 117, 0.3);
                background:
                    linear-gradient(180deg, rgba(158, 200, 117, 0.14), rgba(158, 200, 117, 0.065)),
                    rgba(18, 25, 16, 0.76);
            }

            .message.system {
                max-width: 100%;
                color: var(--muted);
                border-style: dashed;
                background: rgba(255, 255, 255, 0.022);
                font-family: var(--mono);
                font-size: 0.79rem;
                letter-spacing: 0.01em;
            }

            .message.error {
                max-width: 100%;
                border-color: rgba(223, 123, 112, 0.36);
                background:
                    linear-gradient(180deg, rgba(223, 123, 112, 0.14), rgba(223, 123, 112, 0.08)),
                    rgba(41, 18, 17, 0.82);
                color: #ffd8d3;
            }

            .message.pending::after {
                display: inline-block;
                width: 0.45rem;
                height: 0.45rem;
                margin-left: 0.5rem;
                border-radius: 50%;
                content: "";
                vertical-align: middle;
                background: var(--accent);
                animation: pulse 1.1s ease-in-out infinite;
            }

            .side {
                grid-area: side;
                align-self: stretch;
                display: grid;
                overflow: auto;
                min-height: 0;
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.026), rgba(255, 255, 255, 0.012)),
                    rgba(18, 21, 16, 0.82);
            }

            .side-section:last-child {
                border-bottom: 0;
            }

            .status-card {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 0.75rem;
                align-items: center;
            }

            .status-light {
                width: 0.78rem;
                height: 0.78rem;
                border-radius: 50%;
                background: var(--danger);
                box-shadow: 0 0 0 0.32rem rgba(223, 123, 112, 0.14);
            }

            .status-card.connected .status-light {
                background: var(--accent);
                box-shadow: 0 0 0 0.32rem rgba(158, 200, 117, 0.16);
            }

            .status-card.connecting .status-light {
                background: var(--warning);
                box-shadow: 0 0 0 0.32rem rgba(221, 181, 93, 0.14);
            }

            .label {
                display: block;
                margin-bottom: 0.18rem;
                color: var(--faint);
                font-size: 0.78rem;
            }

            .value {
                color: var(--text);
                font-weight: 620;
            }

            .actions,
            .quick-list {
                display: grid;
                gap: 0.65rem;
            }

            .mode-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.45rem;
            }

            .mode-btn {
                min-height: 2.25rem;
                padding: 0.5rem 0.6rem;
                color: var(--muted);
                background: rgba(255, 255, 255, 0.025);
            }

            .mode-btn[aria-pressed="true"] {
                border-color: rgba(184, 217, 135, 0.48);
                color: #10110f;
                background: var(--accent-strong);
            }

            .button-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.55rem;
            }

            .directory-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0.55rem;
            }

            .primary {
                border-color: rgba(184, 217, 135, 0.45);
                color: #0e100c;
                background:
                    linear-gradient(180deg, #d7efaa, #b9d98a);
            }

            .primary:hover:not(:disabled) {
                color: #0e100c;
                background:
                    linear-gradient(180deg, #dff6b6, #c4e198);
            }

            .danger {
                border-color: rgba(223, 123, 112, 0.34);
                color: #ffe3de;
                background:
                    linear-gradient(180deg, rgba(223, 123, 112, 0.18), rgba(223, 123, 112, 0.1));
            }

            .quick-btn {
                width: 100%;
                min-height: 2.55rem;
                padding: 0.7rem 0.78rem;
                text-align: left;
                color: var(--muted);
                background: rgba(255, 255, 255, 0.02);
            }

            .quick-btn:hover:not(:disabled) {
                color: var(--text);
                background: rgba(255, 255, 255, 0.04);
            }

            .hint {
                color: var(--faint);
                font-size: 0.76rem;
                line-height: 1.5;
            }

            .side-section input {
                width: 100%;
                min-height: 2.55rem;
                padding: 0 0.78rem;
                border: 1px solid var(--line);
                border-radius: var(--radius-sm);
                color: var(--text);
                background: rgba(10, 12, 9, 0.9);
                font-family: var(--mono);
                font-size: 0.82rem;
            }

            .stats {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.55rem;
            }

            .stat {
                padding: 0.7rem;
                border: 1px solid var(--line-soft);
                border-radius: var(--radius-sm);
                background: rgba(255, 255, 255, 0.02);
            }

            .stat strong {
                display: block;
                margin-top: 0.2rem;
                font-family: var(--mono);
                font-size: 1rem;
                font-variant-numeric: tabular-nums;
            }

            .debug-log {
                display: grid;
                gap: 0.5rem;
                max-height: 9rem;
                overflow: auto;
                padding-right: 0.1rem;
                scrollbar-gutter: stable;
            }

            .debug-entry {
                display: grid;
                gap: 0.2rem;
                padding-top: 0.45rem;
                border-top: 1px solid var(--line-soft);
            }

            .debug-entry:first-child {
                padding-top: 0;
                border-top: 0;
            }

            .debug-entry-head {
                color: var(--accent-strong);
                font-family: var(--mono);
                font-size: 0.74rem;
                font-variant-numeric: tabular-nums;
            }

            .debug-entry.ipc .debug-entry-head {
                color: var(--warning);
            }

            .debug-entry.error .debug-entry-head {
                color: var(--danger);
            }

            .debug-entry-body {
                margin: 0;
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.72rem;
                line-height: 1.55;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .composer {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0.75rem;
                align-items: center;
                padding: 0.92rem;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.015)),
                    rgba(20, 23, 17, 0.92);
                box-shadow:
                    0 1.2rem 3rem var(--shadow-soft),
                    inset 0 1px 0 rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(16px) saturate(112%);
                -webkit-backdrop-filter: blur(16px) saturate(112%);
            }

            .composer input {
                width: 100%;
                min-height: 2.9rem;
                padding: 0 0.92rem;
                border: 1px solid var(--line);
                border-radius: var(--radius-sm);
                color: var(--text);
                background: rgba(10, 12, 9, 0.92);
            }

            .composer input::placeholder {
                color: var(--faint);
            }

            .ask-card,
            .confirm-card {
                max-width: min(100%, 48rem);
                display: grid;
                gap: 0.95rem;
                padding: 1rem;
                border-color: rgba(199, 225, 139, 0.22);
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.018)),
                    rgba(19, 23, 17, 0.88);
            }

            .message.system.ask-card,
            .message.system.confirm-card {
                font-family: var(--sans);
                font-size: 0.9rem;
                color: var(--text);
            }

            .ask-head {
                color: var(--accent-strong);
                font-family: var(--mono);
                font-size: 0.72rem;
                letter-spacing: 0.08em;
            }

            .ask-question {
                display: grid;
                gap: 0.55rem;
                padding-top: 0.2rem;
            }

            .ask-question-title {
                color: var(--text);
                font-size: 0.98rem;
                line-height: 1.5;
                font-weight: 620;
            }

            .ask-option {
                display: grid;
                gap: 0.45rem;
            }

            .ask-option-btn {
                width: 100%;
                min-height: 2.7rem;
                padding: 0.76rem 0.84rem;
                text-align: left;
                color: var(--text);
                background:
                    linear-gradient(180deg, rgba(255, 255, 255, 0.032), rgba(255, 255, 255, 0.014)),
                    rgba(255, 255, 255, 0.018);
            }

            .ask-option-btn.recommended {
                border-color: rgba(199, 225, 139, 0.36);
                box-shadow: inset 0 0 0 1px rgba(199, 225, 139, 0.08);
            }

            .ask-option-btn.selected {
                border-color: rgba(199, 225, 139, 0.74);
                color: #11130d;
                background:
                    linear-gradient(180deg, #d9f0ac, #bfdc8e);
            }

            .ask-other-input {
                width: 100%;
                min-height: 2.55rem;
                padding: 0 0.78rem;
                border: 1px solid var(--line);
                border-radius: var(--radius-sm);
                color: var(--text);
                background: rgba(10, 12, 9, 0.92);
                font-family: var(--sans);
            }

            .ask-other-input::placeholder {
                color: var(--faint);
            }

            .ask-submit {
                justify-self: end;
                min-width: 7.5rem;
            }

            .confirm-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.55rem;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.35;
                    transform: scale(0.86);
                }

                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @media (max-width: 1080px) {
                .workspace {
                    grid-template-columns: minmax(0, 1fr) minmax(17rem, 19rem);
                }
            }

            @media (max-width: 900px) {
                .topbar,
                .workspace {
                    grid-template-columns: 1fr;
                }

                .topbar {
                    gap: 0.85rem;
                    align-items: stretch;
                }

                .brand {
                    gap: 0.3rem;
                }

                .endpoint {
                    width: 100%;
                }

                .workspace {
                    display: flex;
                    flex-direction: column;
                }

                .conversation {
                    min-height: 0;
                    flex: 1 1 auto;
                }

                .side {
                    flex: 0 0 auto;
                    max-height: min(30vh, 18rem);
                    overflow: auto;
                }

                .side-section {
                    padding: 0.78rem 0.82rem;
                }
            }

            @media (max-width: 620px) {
                .shell {
                    width: min(100% - 0.6rem, 88rem);
                    padding-top: 0.62rem;
                }

                .workspace {
                    gap: 0.56rem;
                }

                .conversation-head,
                .composer {
                    grid-template-columns: 1fr;
                }

                .conversation-head {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 0.6rem;
                }

                .message {
                    max-width: 100%;
                }

                .composer {
                    gap: 0.48rem;
                }

                .composer button {
                    width: 100%;
                }

                .mode-grid,
                .button-row {
                    grid-template-columns: 1fr;
                }

                .side {
                    max-height: min(28vh, 16rem);
                }

                .confirm-actions {
                    grid-template-columns: 1fr;
                }

                .ask-submit {
                    width: 100%;
                    justify-self: stretch;
                }
            }

            @media (max-width: 420px) {
                .shell {
                    width: min(100% - 0.5rem, 88rem);
                }

                h1 {
                    font-size: clamp(1.75rem, 10vw, 2.35rem);
                }

                .endpoint {
                    padding: 0.7rem 0.78rem;
                }

                .workspace {
                    gap: 0.48rem;
                }

                .conversation-head,
                .side-section,
                .composer {
                    padding-inline: 0.76rem;
                }

                .message,
                .ask-card,
                .confirm-card {
                    padding: 0.76rem 0.8rem;
                }

                .debug-log {
                    max-height: 7rem;
                }
            }
        </style>
    </head>
    <body>
        <a class="skip-link" href="#messageInput">跳到输入框</a>

        <div class="shell">
            <header class="topbar">
                <div class="brand">
                    <span class="eyebrow">LOCAL / IPC</span>
                    <h1>本地对话控制台</h1>
                </div>
                <div class="endpoint" aria-label="连接端点">
                    <span>WebSocket bridge</span>
                    <code id="bridgeUrlText">ws://127.0.0.1:17878</code>
                    <small id="protocolText">flyflor.ipc</small>
                </div>
            </header>

            <main class="workspace" id="main">
                <section class="conversation" aria-label="对话输出">
                    <div class="conversation-head">
                        <h2 class="panel-title">流式输出</h2>
                        <div class="stream-state" id="streamState" aria-live="polite">
                            <span class="stream-dot" aria-hidden="true"></span>
                            <span id="streamText">idle</span>
                            <span class="signal-pill" id="signalPill">ready</span>
                        </div>
                    </div>

                    <div class="chat" id="chat" aria-live="polite"></div>
                </section>

                <aside class="side" aria-label="控制面板">
                    <section class="side-section">
                        <div id="status" class="status-card disconnected">
                            <span class="status-light" aria-hidden="true"></span>
                            <div>
                                <span class="label">连接状态</span>
                                <span class="value" id="statusText">未连接</span>
                            </div>
                        </div>
                    </section>

                    <section class="side-section actions">
                        <h2 class="panel-title">连接与焦点</h2>
                        <button class="primary" id="connectBtn">连接</button>
                        <div class="button-row">
                            <button id="disconnectBtn" disabled>断开</button>
                            <button class="danger" id="cancelBtn" disabled>取消焦点</button>
                        </div>
                        <button id="clearBtn" disabled>清空本地显示</button>
                    </section>

                    <section class="side-section actions">
                        <h2 class="panel-title">执行目录</h2>
                        <div class="directory-row">
                            <input id="workingDirectoryInput" type="text" value="" placeholder="例如：项目根目录或 ./reference/pi" />
                            <button id="cwdConfirmBtn" type="button" disabled>确认</button>
                        </div>
                        <small class="hint">相对路径会按这里的目录解析；绝对路径仍必须位于允许根内。</small>
                    </section>

                    <section class="side-section quick-list" id="quickActions" hidden>
                        <h2 class="panel-title">快速输入</h2>
                        <button class="quick-btn" data-msg="你好自我介绍下">自我介绍</button>
                        <button class="quick-btn" data-msg="解释当前代码库架构">解释架构</button>
                        <button class="quick-btn" data-msg="帮我写一个最小测试">写一个最小测试</button>
                        <button class="quick-btn" data-msg="审阅当前方案的风险和遗漏">审阅风险</button>
                    </section>

                    <section class="side-section">
                        <h2 class="panel-title">计数</h2>
                        <div class="stats">
                            <div class="stat">
                                <span class="label">消息</span>
                                <strong id="messageCount">0</strong>
                            </div>
                            <div class="stat">
                                <span class="label">片段</span>
                                <strong id="chunkCount">0</strong>
                            </div>
                            <div class="stat">
                                <span class="label">包</span>
                                <strong id="packetCount">0</strong>
                            </div>
                            <div class="stat">
                                <span class="label">错误</span>
                                <strong id="errorCount">0</strong>
                            </div>
                        </div>
                    </section>

                    <section class="side-section">
                        <h2 class="panel-title">调试日志</h2>
                        <div class="debug-log" id="debugLog" aria-live="polite"></div>
                    </section>
                </aside>
            </main>

            <form class="composer" id="composer">
                <input type="text" id="messageInput" placeholder="输入消息" autocomplete="off" disabled />
                <button class="primary" id="sendBtn" type="submit" disabled>发送</button>
            </form>
        </div>

        <script>
            const BRIDGE_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
            const IPC_PROTOCOL = 'flyflor.ipc';
            const SPEAKER_STORAGE_KEY = 'flyflor.speakerId';
            const speakerId = localStorage.getItem(SPEAKER_STORAGE_KEY) || crypto.randomUUID();
            localStorage.setItem(SPEAKER_STORAGE_KEY, speakerId);
            const IPC_DEBUG = true;

            let ws = null;
            let kernelConnected = false;
            let currentAgentMessage = null;
            let messageTotal = 0;
            let chunkTotal = 0;
            let packetTotal = 0;
            let errorTotal = 0;
            let currentFocusId = null;
            let currentRevision = 0;

            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const streamState = document.getElementById('streamState');
            const streamText = document.getElementById('streamText');
            const signalPill = document.getElementById('signalPill');
            const chat = document.getElementById('chat');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const clearBtn = document.getElementById('clearBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');
            const workingDirectoryInput = document.getElementById('workingDirectoryInput');
            const cwdConfirmBtn = document.getElementById('cwdConfirmBtn');
            const quickActions = document.getElementById('quickActions');
            const composer = document.getElementById('composer');
            const bridgeUrlText = document.getElementById('bridgeUrlText');
            const messageCount = document.getElementById('messageCount');
            const chunkCount = document.getElementById('chunkCount');
            const packetCount = document.getElementById('packetCount');
            const errorCount = document.getElementById('errorCount');
            const debugLog = document.getElementById('debugLog');

            bridgeUrlText.textContent = BRIDGE_URL;
            renderEmptyState();
            setStreamState(false);

            function renderEmptyState() {
                const empty = document.createElement('div');
                empty.className = 'empty';

                const inner = document.createElement('div');
                inner.className = 'empty-inner';

                const mark = document.createElement('div');
                mark.className = 'empty-mark';
                mark.textContent = '>';

                const title = document.createElement('h2');
                title.textContent = '等待本地连接';

                const text = document.createElement('p');
                text.textContent = '连接后发送消息。Reply 片段会追加到同一条助手回复里，Done 后结束本轮。';

                inner.append(mark, title, text);
                empty.appendChild(inner);
                chat.replaceChildren(empty);
            }

            function removeEmptyState() {
                chat.querySelector('.empty')?.remove();
            }

            function addMessage(content, type) {
                removeEmptyState();
                const message = document.createElement('article');
                message.className = `message ${type}`;
                message.textContent = content;
                chat.appendChild(message);
                chat.scrollTop = chat.scrollHeight;
                if (type === 'user' || type === 'agent') {
                    messageTotal += 1;
                    updateStats();
                }
                return message;
            }

            function createPendingAgentMessage() {
                if (!currentAgentMessage) {
                    currentAgentMessage = addMessage('', 'agent');
                }
                currentAgentMessage.classList.add('pending');
                setStreamState(true);
                return currentAgentMessage;
            }

            function appendAgentDelta(content) {
                if (content.length === 0) return;
                createPendingAgentMessage();
                currentAgentMessage.textContent += content;
                chunkTotal += 1;
                updateStats();
                chat.scrollTop = chat.scrollHeight;
            }

            function finishAgentStream() {
                if (currentAgentMessage && currentAgentMessage.textContent.trim().length === 0) {
                    currentAgentMessage.remove();
                    messageTotal = Math.max(0, messageTotal - 1);
                    updateStats();
                } else if (currentAgentMessage) {
                    currentAgentMessage.classList.remove('pending');
                }
                currentAgentMessage = null;
                setStreamState(false);
                setInputEnabled();
                messageInput.focus();
            }

            function cancelPendingMessage() {
                if (currentAgentMessage && currentAgentMessage.textContent.trim().length === 0) {
                    currentAgentMessage.remove();
                    messageTotal = Math.max(0, messageTotal - 1);
                    updateStats();
                } else if (currentAgentMessage) {
                    currentAgentMessage.classList.remove('pending');
                }
                currentAgentMessage = null;
                setStreamState(false);
                setInputEnabled();
            }

            function setStatus(mode, text) {
                status.className = `status-card ${mode}`;
                statusText.textContent = text;
            }

            function setStreamState(active) {
                streamState.classList.toggle('active', active);
                streamText.textContent = active ? 'streaming' : 'idle';
                if (!active) signalPill.textContent = 'ready';
            }

            function canUseInput() {
                return Boolean(ws && ws.readyState === WebSocket.OPEN && kernelConnected);
            }

            function setInputEnabled() {
                const enabled = canUseInput();
                sendBtn.disabled = !enabled;
                messageInput.disabled = !enabled;
                workingDirectoryInput.disabled = !enabled;
                cwdConfirmBtn.disabled = !enabled;
                cancelBtn.disabled = !enabled || !currentFocusId;
                document.querySelectorAll('.quick-btn').forEach((button) => {
                    button.disabled = !enabled;
                });
            }

            function updateStats() {
                messageCount.textContent = String(messageTotal);
                chunkCount.textContent = String(chunkTotal);
                packetCount.textContent = String(packetTotal);
                errorCount.textContent = String(errorTotal);
            }

            let interaction = null;

            function envelope(action, data) {
                return { protocol: IPC_PROTOCOL, messageId: crypto.randomUUID(), action, data };
            }

            function sendAnswer(response) {
                if (!ws || ws.readyState !== WebSocket.OPEN || !interaction) return;
                const packet = envelope('answer', { speakerId, ...interaction, response });
                debugIpc('ws.out', { action: packet.action, focusId: interaction.focusId, requestId: interaction.requestId });
                ws.send(JSON.stringify(packet));
                interaction = null;
                setInputEnabled();
                createPendingAgentMessage();
            }

            function sendCancel() {
                if (!ws || ws.readyState !== WebSocket.OPEN || !currentFocusId) return;
                const packet = envelope('cancel', { speakerId, focusId: currentFocusId });
                debugIpc('ws.out', { action: packet.action, focusId: currentFocusId });
                ws.send(JSON.stringify(packet));
            }

            function renderAskPrompt(data) {
                removeEmptyState();
                const questions = Array.isArray(data?.questions) ? data.questions : [];
                const card = document.createElement('article');
                card.className = 'message system ask-card';

                const head = document.createElement('div');
                head.className = 'ask-head';
                head.textContent = '需要你的回答';
                card.appendChild(head);

                const picks = questions.map(() => ({ label: null, custom: '' }));

                questions.forEach((item, qIndex) => {
                    const block = document.createElement('div');
                    block.className = 'ask-question';

                    const title = document.createElement('div');
                    title.className = 'ask-question-title';
                    title.textContent = `${qIndex + 1}. ${String(item?.question ?? '')}`;
                    block.appendChild(title);

                    const options = Array.isArray(item?.options) ? item.options : [];
                    options.forEach((option) => {
                        const isOther = option?.custom === true;
                        const row = document.createElement('div');
                        row.className = 'ask-option';

                        const button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'ask-option-btn';
                        if (option?.recommended) button.classList.add('recommended');
                        button.textContent = option?.description
                            ? `${option.label} — ${option.description}`
                            : String(option?.label ?? '');
                        row.appendChild(button);

                        let customInput = null;
                        if (isOther) {
                            customInput = document.createElement('input');
                            customInput.type = 'text';
                            customInput.className = 'ask-other-input';
                            customInput.placeholder = '自定义回答，可引用上面的方案';
                            customInput.disabled = true;
                            customInput.addEventListener('input', () => {
                                picks[qIndex].custom = customInput.value;
                            });
                            row.appendChild(customInput);
                        }

                        button.addEventListener('click', () => {
                            block.querySelectorAll('.ask-option-btn').forEach((other) => other.classList.remove('selected'));
                            button.classList.add('selected');
                            picks[qIndex].label = String(option?.label ?? '');
                            block.querySelectorAll('.ask-other-input').forEach((input) => {
                                input.disabled = true;
                            });
                            if (isOther && customInput) {
                                customInput.disabled = false;
                                customInput.focus();
                            }
                        });

                        block.appendChild(row);
                    });

                    card.appendChild(block);
                });

                const submit = document.createElement('button');
                submit.type = 'button';
                submit.className = 'primary ask-submit';
                submit.textContent = '提交回答';
                submit.addEventListener('click', () => {
                    const answers = questions.map((item, qIndex) => {
                        const pick = picks[qIndex];
                        return {
                            question: String(item?.question ?? ''),
                            answer: pick.custom || pick.label || '',
                        };
                    });
                    card.querySelectorAll('button, input').forEach((el) => { el.disabled = true; });
                    sendAnswer({ kind: 'ask', answers });
                });
                card.appendChild(submit);

                chat.appendChild(card);
                chat.scrollTop = chat.scrollHeight;
            }

            function renderConfirmPrompt(data) {
                removeEmptyState();
                const card = document.createElement('article');
                card.className = 'message system confirm-card';

                const head = document.createElement('div');
                head.className = 'ask-head';
                head.textContent = '需要批准';
                card.appendChild(head);

                const title = document.createElement('div');
                title.className = 'ask-question-title';
                title.textContent = data?.call
                    ? `${String(data.call.name)} ${JSON.stringify(data.call.arguments ?? {})}`
                    : String(data?.question ?? '');
                card.appendChild(title);

                const actions = document.createElement('div');
                actions.className = 'confirm-actions';

                const approve = document.createElement('button');
                approve.type = 'button';
                approve.className = 'ask-option-btn';
                approve.textContent = '批准';

                const reject = document.createElement('button');
                reject.type = 'button';
                reject.className = 'ask-option-btn';
                reject.textContent = '拒绝';

                if (data?.recommended === true) approve.classList.add('recommended');
                if (data?.recommended === false) reject.classList.add('recommended');

                const finish = (approved) => {
                    card.querySelectorAll('button').forEach((el) => { el.disabled = true; });
                    sendAnswer({ kind: 'confirm', approved });
                };
                approve.addEventListener('click', () => finish(true));
                reject.addEventListener('click', () => finish(false));

                actions.append(approve, reject);
                card.appendChild(actions);

                chat.appendChild(card);
                chat.scrollTop = chat.scrollHeight;
            }

            function handlePacket(msg) {
                packetTotal += 1;
                updateStats();
                appendDebugEntry('packet', `packet.${String(msg.action)}`, msg.data);
                if (msg.action === 'streamEnd') {
                    if (!msg.data?.focusId || msg.data.focusId === currentFocusId) currentFocusId = null;
                    finishAgentStream();
                    setInputEnabled();
                    return;
                }
                if (msg.action === 'agent') {
                    currentFocusId = msg.data?.focusId ?? currentFocusId;
                    currentRevision = msg.data?.revision ?? currentRevision;
                    appendAgentDelta(typeof msg.data?.chunk === 'string' ? msg.data.chunk : '');
                    return;
                }
                if (msg.action === 'responseReset') {
                    currentFocusId = msg.data?.focusId ?? currentFocusId;
                    currentRevision = msg.data?.revision ?? currentRevision;
                    if (currentAgentMessage) currentAgentMessage.textContent = '';
                    signalPill.textContent = `revision ${currentRevision}`;
                    return;
                }
                if (msg.action === 'attention') {
                    signalPill.textContent = String(msg.data?.state ?? 'attention');
                    return;
                }
                if (msg.action === 'event' && msg.data?.type === 'receipt') {
                    const receipt = msg.data.receipt;
                    if (receipt?.state === 'focused' || receipt?.state === 'merged') {
                        currentFocusId = receipt.focusId ?? currentFocusId;
                        currentRevision = receipt.revision ?? currentRevision;
                    }
                    signalPill.textContent = String(receipt?.state ?? 'received');
                    setInputEnabled();
                    return;
                }
                if (msg.action === 'event' && msg.data?.type === 'focus') {
                    currentFocusId = msg.data.focusId ?? currentFocusId;
                    currentRevision = msg.data.revision ?? currentRevision;
                    signalPill.textContent = 'focused';
                    setInputEnabled();
                    return;
                }
                if (msg.action === 'ask') {
                    interaction = { focusId: msg.data?.focusId, requestId: msg.data?.requestId };
                    cancelPendingMessage();
                    signalPill.textContent = 'ask';
                    renderAskPrompt(msg.data);
                    return;
                }
                if (msg.action === 'confirm') {
                    interaction = { focusId: msg.data?.focusId, requestId: msg.data?.requestId };
                    cancelPendingMessage();
                    signalPill.textContent = 'confirm';
                    renderConfirmPrompt(msg.data);
                    return;
                }
                if (msg.action === 'open') {
                    kernelConnected = true;
                    setStatus('connected', '已连接');
                    setInputEnabled();
                    addMessage('内核 IPC 已连接', 'system');
                    return;
                }
                if (msg.action === 'close' || msg.action === 'end') {
                    kernelConnected = false;
                    setStatus('disconnected', '内核已断开');
                    cancelPendingMessage();
                    setInputEnabled();
                    addMessage('内核 IPC 已断开', 'system');
                    return;
                }
                if (msg.action === 'error') {
                    errorTotal += 1;
                    updateStats();
                    cancelPendingMessage();
                    setInputEnabled();
                    addMessage(`错误: ${String(msg.data?.message ?? msg.data ?? '')}`, 'error');
                    return;
                }
                addMessage(`收到: ${JSON.stringify(msg)}`, 'system');
            }

            function debugIpc(event, detail) {
                if (!IPC_DEBUG) return;
                if (detail === undefined) console.debug(`[IPC/browser] ${event}`);
                else console.debug(`[IPC/browser] ${event}`, detail);
                appendDebugEntry('ipc', event, detail);
            }

            function previewText(value, max = 160) {
                const clean = String(value).replaceAll('\0', '\\0');
                return clean.length > max ? `${clean.slice(0, max)}...` : clean;
            }

            function charCodes(value, max = 32) {
                return Array.from(String(value).slice(0, max), (char) => char.charCodeAt(0));
            }

            function appendDebugEntry(kind, title, detail) {
                if (!debugLog) return;
                const entry = document.createElement('article');
                entry.className = `debug-entry ${kind}`;

                const head = document.createElement('div');
                head.className = 'debug-entry-head';
                head.textContent = title;

                const body = document.createElement('pre');
                body.className = 'debug-entry-body';
                body.textContent = formatDebugDetail(detail);

                entry.append(head, body);
                debugLog.appendChild(entry);
                while (debugLog.children.length > 80) {
                    debugLog.removeChild(debugLog.firstElementChild);
                }
                debugLog.scrollTop = debugLog.scrollHeight;
            }

            function formatDebugDetail(detail) {
                if (detail === undefined) return '';
                if (typeof detail === 'string') return previewText(detail, 800);
                try {
                    return previewText(JSON.stringify(detail, null, 2), 1200);
                } catch (error) {
                    return previewText(error instanceof Error ? error.message : String(detail), 800);
                }
            }

            async function readSocketMessage(eventData) {
                if (typeof eventData === 'string') {
                    debugIpc('ws.in', {
                        type: 'string',
                        chars: eventData.length,
                        preview: previewText(eventData),
                        charCodes: charCodes(eventData),
                    });
                    try {
                        return [JSON.parse(eventData)];
                    } catch (error) {
                        debugIpc('ws.in.json-error', {
                            message: error instanceof Error ? error.message : String(error),
                            preview: previewText(eventData),
                            charCodes: charCodes(eventData),
                        });
                        throw error;
                    }
                }
                debugIpc('ws.in', {
                    type: eventData?.constructor?.name ?? typeof eventData,
                });
                throw new Error('WebSocket bridge 只支持 JSON 文本消息');
            }

            function sendUserMessage(text) {
                if (!text || !canUseInput()) return;
                setInputEnabled();
                const packet = envelope('user', { speakerId, text });
                debugIpc('ws.out', {
                    action: packet.action,
                    textLength: text.length,
                });
                ws.send(JSON.stringify(packet));
                addMessage(text, 'user');
                createPendingAgentMessage();
            }

            function sendWorkingDirectory() {
                if (!canUseInput()) return;
                const path = workingDirectoryInput.value.trim();
                if (!path) {
                    addMessage('执行目录为空，未提交', 'error');
                    return;
                }
                sendUserMessage(`Use this working directory for the current focus: ${path}`);
            }

            function connect() {
                if (ws && ws.readyState !== WebSocket.CLOSED) return;
                setStatus('connecting', '连接中');
                connectBtn.disabled = true;
                kernelConnected = false;
                ws = new WebSocket(BRIDGE_URL);

                ws.onopen = () => {
                    setStatus('connecting', '桥接已连接，等待内核');
                    disconnectBtn.disabled = false;
                    clearBtn.disabled = false;
                    quickActions.hidden = false;
                    setInputEnabled();
                    addMessage('WebSocket bridge 已连接', 'system');
                };

                ws.onmessage = async (event) => {
                    try {
                        for (const packet of await readSocketMessage(event.data)) handlePacket(packet);
                    } catch (error) {
                        errorTotal += 1;
                        updateStats();
                        addMessage(`解析错误: ${error instanceof Error ? error.message : String(error)}`, 'error');
                    }
                };

                ws.onclose = () => {
                    kernelConnected = false;
                    setStatus('disconnected', '未连接');
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    clearBtn.disabled = false;
                    quickActions.hidden = true;
                    cancelPendingMessage();
                    setInputEnabled();
                    addMessage('WebSocket 已断开', 'system');
                    ws = null;
                };

                ws.onerror = () => {
                    kernelConnected = false;
                    setInputEnabled();
                    addMessage('连接错误: WebSocket 连接失败', 'error');
                };
            }

            connectBtn.addEventListener('click', connect);
            cwdConfirmBtn.addEventListener('click', sendWorkingDirectory);
            cancelBtn.addEventListener('click', sendCancel);

            disconnectBtn.addEventListener('click', () => {
                if (ws) ws.close();
            });

            clearBtn.addEventListener('click', () => {
                currentAgentMessage = null;
                messageTotal = 0;
                chunkTotal = 0;
                packetTotal = 0;
                errorTotal = 0;
                updateStats();
                setStreamState(false);
                renderEmptyState();
                setInputEnabled();
            });

            composer.addEventListener('submit', (event) => {
                event.preventDefault();
                const text = messageInput.value.trim();
                if (!text) return;
                sendUserMessage(text);
                messageInput.value = '';
            });

            document.querySelectorAll('.quick-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const text = button.getAttribute('data-msg') ?? '';
                    sendUserMessage(text);
                });
            });
        </script>
    </body>
</html>
