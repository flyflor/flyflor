<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Flyflor 本地 IPC 对话测试页" />
        <title>Flyflor IPC 控制台</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #10110f;
                --panel: #181916;
                --panel-soft: #20211d;
                --panel-strong: #24251f;
                --line: #34362e;
                --line-soft: #292b25;
                --text: #f0eee6;
                --muted: #aaa69a;
                --faint: #777368;
                --accent: #8ebf70;
                --accent-strong: #b8d987;
                --warning: #d8a94f;
                --danger: #d76f63;
                --shadow: rgba(4, 5, 4, 0.42);
                --mono: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
                --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            }

            * {
                box-sizing: border-box;
            }

            html {
                min-height: 100%;
                background: var(--bg);
                scroll-behavior: smooth;
            }

            body {
                min-height: 100dvh;
                margin: 0;
                font-family: var(--sans);
                color: var(--text);
                background:
                    radial-gradient(circle at 12% 0%, rgba(142, 191, 112, 0.16), transparent 28rem),
                    linear-gradient(135deg, rgba(255, 255, 255, 0.025), transparent 36%),
                    var(--bg);
            }

            body::before {
                position: fixed;
                inset: 0;
                pointer-events: none;
                content: "";
                opacity: 0.24;
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
                background-size: 3.5rem 3.5rem;
                mask-image: linear-gradient(to bottom, black, transparent 78%);
            }

            button,
            input {
                font: inherit;
            }

            button {
                min-height: 2.5rem;
                padding: 0.68rem 0.95rem;
                border: 1px solid var(--line);
                border-radius: 0.45rem;
                color: var(--text);
                background: var(--panel-soft);
                cursor: pointer;
                transition:
                    transform 160ms ease,
                    border-color 160ms ease,
                    background 160ms ease,
                    color 160ms ease;
            }

            button:hover:not(:disabled) {
                transform: translateY(-1px);
                border-color: #505346;
                background: var(--panel-strong);
            }

            button:active:not(:disabled) {
                transform: translateY(0) scale(0.99);
            }

            button:focus-visible,
            input:focus-visible {
                outline: 2px solid rgba(184, 217, 135, 0.72);
                outline-offset: 2px;
            }

            button:disabled,
            input:disabled {
                cursor: not-allowed;
                opacity: 0.48;
            }

            .skip-link {
                position: fixed;
                top: 0.75rem;
                left: 0.75rem;
                z-index: 2;
                padding: 0.55rem 0.75rem;
                border-radius: 0.35rem;
                color: var(--bg);
                background: var(--accent-strong);
                transform: translateY(-160%);
            }

            .skip-link:focus {
                transform: translateY(0);
            }

            .shell {
                width: min(72rem, calc(100% - 2rem));
                min-height: 100dvh;
                margin: 0 auto;
                padding: 1.25rem 0 1.5rem;
                display: grid;
                grid-template-rows: auto 1fr auto;
                gap: 1rem;
            }

            .topbar {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 1rem;
                align-items: end;
                padding: 0.35rem 0 0.75rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            }

            .brand {
                min-width: 0;
            }

            .eyebrow {
                display: block;
                margin-bottom: 0.45rem;
                color: var(--accent-strong);
                font-family: var(--mono);
                font-size: 0.76rem;
                font-variant-numeric: tabular-nums;
            }

            h1 {
                margin: 0;
                font-size: clamp(2rem, 5vw, 4.4rem);
                line-height: 0.95;
                font-weight: 720;
                text-wrap: balance;
            }

            .endpoint {
                justify-self: end;
                display: grid;
                gap: 0.35rem;
                min-width: min(100%, 18rem);
                padding: 0.75rem 0.85rem;
                border: 1px solid var(--line);
                border-radius: 0.6rem;
                background: rgba(24, 25, 22, 0.78);
                box-shadow: 0 1.25rem 3rem var(--shadow);
            }

            .endpoint span:first-child {
                color: var(--faint);
                font-size: 0.8rem;
            }

            .endpoint code {
                overflow: hidden;
                color: var(--text);
                font-family: var(--mono);
                font-size: 0.86rem;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .endpoint small {
                color: var(--faint);
                font-family: var(--mono);
                font-size: 0.74rem;
            }

            .workspace {
                min-height: 0;
                display: grid;
                grid-template-columns: minmax(0, 1fr) 18rem;
                gap: 1rem;
            }

            .conversation,
            .side {
                min-width: 0;
                border: 1px solid var(--line);
                border-radius: 0.7rem;
                background: rgba(24, 25, 22, 0.84);
                box-shadow: 0 1.4rem 4rem var(--shadow);
            }

            .conversation {
                min-height: 34rem;
                display: grid;
                grid-template-rows: auto 1fr;
                overflow: hidden;
            }

            .conversation-head,
            .side-section {
                padding: 0.9rem;
                border-bottom: 1px solid var(--line-soft);
            }

            .conversation-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                background: rgba(255, 255, 255, 0.025);
            }

            .panel-title {
                margin: 0;
                font-size: 0.95rem;
                font-weight: 650;
            }

            .stream-state {
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.78rem;
                font-variant-numeric: tabular-nums;
            }

            .stream-dot {
                width: 0.5rem;
                height: 0.5rem;
                border-radius: 50%;
                background: var(--faint);
            }

            .stream-state.active .stream-dot {
                background: var(--accent);
                box-shadow: 0 0 0 0.28rem rgba(142, 191, 112, 0.16);
                animation: pulse 1.1s ease-in-out infinite;
            }

            .signal-pill {
                display: inline-flex;
                align-items: center;
                min-height: 1.75rem;
                padding: 0.2rem 0.55rem;
                border: 1px solid rgba(184, 217, 135, 0.24);
                border-radius: 999px;
                color: var(--accent-strong);
                background: rgba(142, 191, 112, 0.07);
                font-family: var(--mono);
                font-size: 0.74rem;
                white-space: nowrap;
            }

            .chat {
                min-height: 0;
                padding: 1rem;
                overflow-y: auto;
                scrollbar-color: #4a4c41 transparent;
            }

            .empty {
                min-height: 100%;
                display: grid;
                place-items: center;
                padding: 2rem;
                color: var(--muted);
                text-align: center;
            }

            .empty-inner {
                width: min(100%, 28rem);
                display: grid;
                gap: 0.8rem;
            }

            .empty-mark {
                width: 3.5rem;
                height: 3.5rem;
                margin: 0 auto;
                display: grid;
                place-items: center;
                border: 1px solid rgba(184, 217, 135, 0.22);
                border-radius: 0.85rem;
                color: var(--accent-strong);
                font-family: var(--mono);
                font-size: 1.3rem;
                background: rgba(142, 191, 112, 0.08);
            }

            .empty h2 {
                margin: 0;
                color: var(--text);
                font-size: 1.1rem;
            }

            .empty p {
                margin: 0;
                line-height: 1.7;
            }

            .message {
                width: fit-content;
                max-width: min(44rem, 86%);
                margin: 0 0 0.8rem;
                padding: 0.8rem 0.9rem;
                border: 1px solid var(--line-soft);
                border-radius: 0.75rem;
                line-height: 1.65;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .message.user {
                margin-left: auto;
                border-color: rgba(216, 169, 79, 0.28);
                background: rgba(216, 169, 79, 0.1);
            }

            .message.agent {
                border-color: rgba(142, 191, 112, 0.26);
                background: rgba(142, 191, 112, 0.085);
            }

            .message.system {
                max-width: 100%;
                color: var(--muted);
                border-style: dashed;
                background: rgba(255, 255, 255, 0.026);
                font-family: var(--mono);
                font-size: 0.82rem;
            }

            .message.error {
                max-width: 100%;
                border-color: rgba(215, 111, 99, 0.38);
                background: rgba(215, 111, 99, 0.11);
                color: #ffd8d3;
            }

            .message.pending::after {
                display: inline-block;
                width: 0.45rem;
                height: 0.45rem;
                margin-left: 0.5rem;
                border-radius: 50%;
                content: "";
                vertical-align: middle;
                background: var(--accent);
                animation: pulse 1.1s ease-in-out infinite;
            }

            .side {
                align-self: stretch;
                overflow: hidden;
            }

            .side-section:last-child {
                border-bottom: 0;
            }

            .status-card {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 0.75rem;
                align-items: center;
            }

            .status-light {
                width: 0.78rem;
                height: 0.78rem;
                border-radius: 50%;
                background: var(--danger);
                box-shadow: 0 0 0 0.32rem rgba(215, 111, 99, 0.14);
            }

            .status-card.connected .status-light {
                background: var(--accent);
                box-shadow: 0 0 0 0.32rem rgba(142, 191, 112, 0.16);
            }

            .status-card.connecting .status-light {
                background: var(--warning);
                box-shadow: 0 0 0 0.32rem rgba(216, 169, 79, 0.14);
            }

            .label {
                display: block;
                margin-bottom: 0.18rem;
                color: var(--faint);
                font-size: 0.78rem;
            }

            .value {
                color: var(--text);
                font-weight: 620;
            }

            .actions,
            .quick-list {
                display: grid;
                gap: 0.55rem;
            }

            .mode-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.45rem;
            }

            .mode-btn {
                min-height: 2.25rem;
                padding: 0.5rem 0.6rem;
                color: var(--muted);
                background: rgba(255, 255, 255, 0.025);
            }

            .mode-btn[aria-pressed="true"] {
                border-color: rgba(184, 217, 135, 0.48);
                color: #10110f;
                background: var(--accent-strong);
            }

            .button-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.55rem;
            }

            .directory-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0.55rem;
            }

            .primary {
                border-color: rgba(184, 217, 135, 0.52);
                color: #10110f;
                background: var(--accent-strong);
            }

            .primary:hover:not(:disabled) {
                color: #10110f;
                background: #c8e69b;
            }

            .danger {
                border-color: rgba(215, 111, 99, 0.34);
                color: #ffd8d3;
                background: rgba(215, 111, 99, 0.12);
            }

            .quick-btn {
                width: 100%;
                min-height: 2.3rem;
                padding: 0.55rem 0.7rem;
                text-align: left;
                color: var(--muted);
                background: rgba(255, 255, 255, 0.025);
            }

            .quick-btn:hover:not(:disabled) {
                color: var(--text);
            }

            .hint {
                color: var(--faint);
                font-size: 0.76rem;
                line-height: 1.5;
            }

            .side-section input {
                width: 100%;
                min-height: 2.45rem;
                padding: 0 0.75rem;
                border: 1px solid var(--line);
                border-radius: 0.45rem;
                color: var(--text);
                background: #11120f;
                font-family: var(--mono);
                font-size: 0.82rem;
            }

            .stats {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.55rem;
            }

            .stat {
                padding: 0.65rem;
                border: 1px solid var(--line-soft);
                border-radius: 0.5rem;
                background: rgba(255, 255, 255, 0.02);
            }

            .stat strong {
                display: block;
                margin-top: 0.2rem;
                font-family: var(--mono);
                font-size: 1rem;
                font-variant-numeric: tabular-nums;
            }

            .debug-log {
                display: grid;
                gap: 0.45rem;
                max-height: 18rem;
                overflow-y: auto;
                padding-right: 0.1rem;
                scrollbar-color: #4a4c41 transparent;
            }

            .debug-entry {
                display: grid;
                gap: 0.2rem;
                padding-top: 0.45rem;
                border-top: 1px solid var(--line-soft);
            }

            .debug-entry:first-child {
                padding-top: 0;
                border-top: 0;
            }

            .debug-entry-head {
                color: var(--accent-strong);
                font-family: var(--mono);
                font-size: 0.74rem;
                font-variant-numeric: tabular-nums;
            }

            .debug-entry.ipc .debug-entry-head {
                color: var(--warning);
            }

            .debug-entry.error .debug-entry-head {
                color: var(--danger);
            }

            .debug-entry-body {
                margin: 0;
                color: var(--muted);
                font-family: var(--mono);
                font-size: 0.72rem;
                line-height: 1.55;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .composer {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0.7rem;
                align-items: center;
                padding: 0.9rem;
                border: 1px solid var(--line);
                border-radius: 0.7rem;
                background: rgba(24, 25, 22, 0.9);
                box-shadow: 0 1.2rem 3rem var(--shadow);
            }

            .composer input {
                width: 100%;
                min-height: 2.75rem;
                padding: 0 0.9rem;
                border: 1px solid var(--line);
                border-radius: 0.45rem;
                color: var(--text);
                background: #11120f;
            }

            .composer input::placeholder {
                color: var(--faint);
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.35;
                    transform: scale(0.86);
                }

                50% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @media (max-width: 900px) {
                .topbar,
                .workspace {
                    grid-template-columns: 1fr;
                }

                .endpoint {
                    justify-self: stretch;
                }

                .side {
                    order: -1;
                }

                .conversation {
                    min-height: 28rem;
                }
            }

            @media (max-width: 620px) {
                .shell {
                    width: min(100% - 1rem, 72rem);
                    padding-top: 0.75rem;
                }

                .conversation-head,
                .composer {
                    grid-template-columns: 1fr;
                }

                .conversation-head {
                    align-items: flex-start;
                    flex-direction: column;
                }

                .message {
                    max-width: 100%;
                }

                .composer {
                    gap: 0.55rem;
                }

                .composer button {
                    width: 100%;
                }

                .mode-grid,
                .button-row {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <a class="skip-link" href="#messageInput">跳到输入框</a>

        <div class="shell">
            <header class="topbar">
                <div class="brand">
                    <span class="eyebrow">FLYFLOR / IPC</span>
                    <h1>本地对话控制台</h1>
                </div>
                <div class="endpoint" aria-label="连接端点">
                    <span>WebSocket bridge</span>
                    <code id="bridgeUrlText">ws://127.0.0.1:17878</code>
                    <small id="protocolText">send: JSON packet</small>
                </div>
            </header>

            <main class="workspace" id="main">
                <section class="conversation" aria-label="对话输出">
                    <div class="conversation-head">
                        <h2 class="panel-title">流式输出</h2>
                        <div class="stream-state" id="streamState" aria-live="polite">
                            <span class="stream-dot" aria-hidden="true"></span>
                            <span id="streamText">idle</span>
                            <span class="signal-pill" id="signalPill">ready</span>
                        </div>
                    </div>

                    <div class="chat" id="chat" aria-live="polite"></div>
                </section>

                <aside class="side" aria-label="控制面板">
                    <section class="side-section">
                        <div id="status" class="status-card disconnected">
                            <span class="status-light" aria-hidden="true"></span>
                            <div>
                                <span class="label">连接状态</span>
                                <span class="value" id="statusText">未连接</span>
                            </div>
                        </div>
                    </section>

                    <section class="side-section actions">
                        <h2 class="panel-title">会话控制</h2>
                        <button class="primary" id="connectBtn">连接</button>
                        <div class="button-row">
                            <button id="disconnectBtn" disabled>断开</button>
                            <button class="danger" id="clearBtn" disabled>清空</button>
                        </div>
                    </section>

                    <section class="side-section actions">
                        <h2 class="panel-title">执行目录</h2>
                        <div class="directory-row">
                            <input id="workingDirectoryInput" type="text" value="/Users/yihuaqing/Desktop/yihuaqing/flyflors/flyflor" placeholder="例如：/Users/.../flyflor-cli 或 ./reference/pi" />
                            <button id="cwdConfirmBtn" type="button" disabled>确认</button>
                        </div>
                        <small class="hint">相对路径会按这里的目录解析；绝对路径仍必须位于允许根内。</small>
                    </section>

                    <section class="side-section quick-list" id="quickActions" hidden>
                        <h2 class="panel-title">快速输入</h2>
                        <button class="quick-btn" data-msg="你好自我介绍下">自我介绍</button>
                        <button class="quick-btn" data-msg="解释 Flyflor 架构">解释架构</button>
                        <button class="quick-btn" data-msg="帮我写一个最小测试">写一个最小测试</button>
                        <button class="quick-btn" data-msg="以后你叫飞花，我是你的主人。你要乖乖的哦">写入灵魂</button>
                    </section>

                    <section class="side-section">
                        <h2 class="panel-title">计数</h2>
                        <div class="stats">
                            <div class="stat">
                                <span class="label">消息</span>
                                <strong id="messageCount">0</strong>
                            </div>
                            <div class="stat">
                                <span class="label">片段</span>
                                <strong id="chunkCount">0</strong>
                            </div>
                            <div class="stat">
                                <span class="label">包</span>
                                <strong id="packetCount">0</strong>
                            </div>
                            <div class="stat">
                                <span class="label">错误</span>
                                <strong id="errorCount">0</strong>
                            </div>
                        </div>
                    </section>

                    <section class="side-section">
                        <h2 class="panel-title">调试日志</h2>
                        <div class="debug-log" id="debugLog" aria-live="polite"></div>
                    </section>
                </aside>
            </main>

            <form class="composer" id="composer">
                <input type="text" id="messageInput" placeholder="输入消息" autocomplete="off" disabled />
                <button class="primary" id="sendBtn" type="submit" disabled>发送</button>
            </form>
        </div>

        <script>
            const BRIDGE_URL = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}`;
            const IPC_DEBUG = true;

            let ws = null;
            let pending = false;
            let currentAgentMessage = null;
            let messageTotal = 0;
            let chunkTotal = 0;
            let packetTotal = 0;
            let errorTotal = 0;

            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const streamState = document.getElementById('streamState');
            const streamText = document.getElementById('streamText');
            const signalPill = document.getElementById('signalPill');
            const chat = document.getElementById('chat');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const clearBtn = document.getElementById('clearBtn');
            const sendBtn = document.getElementById('sendBtn');
            const messageInput = document.getElementById('messageInput');
            const workingDirectoryInput = document.getElementById('workingDirectoryInput');
            const cwdConfirmBtn = document.getElementById('cwdConfirmBtn');
            const quickActions = document.getElementById('quickActions');
            const composer = document.getElementById('composer');
            const bridgeUrlText = document.getElementById('bridgeUrlText');
            const messageCount = document.getElementById('messageCount');
            const chunkCount = document.getElementById('chunkCount');
            const packetCount = document.getElementById('packetCount');
            const errorCount = document.getElementById('errorCount');
            const debugLog = document.getElementById('debugLog');

            bridgeUrlText.textContent = BRIDGE_URL;
            renderEmptyState();
            setStreamState(false);

            function renderEmptyState() {
                const empty = document.createElement('div');
                empty.className = 'empty';

                const inner = document.createElement('div');
                inner.className = 'empty-inner';

                const mark = document.createElement('div');
                mark.className = 'empty-mark';
                mark.textContent = '>';

                const title = document.createElement('h2');
                title.textContent = '等待本地连接';

                const text = document.createElement('p');
                text.textContent = '连接后发送消息。Reply 片段会追加到同一条助手回复里，Done 后结束本轮。';

                inner.append(mark, title, text);
                empty.appendChild(inner);
                chat.replaceChildren(empty);
            }

            function removeEmptyState() {
                chat.querySelector('.empty')?.remove();
            }

            function addMessage(content, type) {
                removeEmptyState();
                const message = document.createElement('article');
                message.className = `message ${type}`;
                message.textContent = content;
                chat.appendChild(message);
                chat.scrollTop = chat.scrollHeight;
                if (type === 'user' || type === 'agent') {
                    messageTotal += 1;
                    updateStats();
                }
                return message;
            }

            function createPendingAgentMessage() {
                if (!currentAgentMessage) {
                    currentAgentMessage = addMessage('', 'agent');
                }
                currentAgentMessage.classList.add('pending');
                setStreamState(true);
                return currentAgentMessage;
            }

            function appendAgentDelta(content) {
                if (content.length === 0) return;
                createPendingAgentMessage();
                currentAgentMessage.textContent += content;
                chunkTotal += 1;
                updateStats();
                chat.scrollTop = chat.scrollHeight;
            }

            function normalizeAgentSignal(data) {
                if (typeof data === 'string') return { type: 'reply', chunk: data, data: undefined };
                if (!data || typeof data !== 'object') return { type: 'reply', chunk: String(data ?? ''), data: undefined };
                return {
                    type: typeof data.type === 'string' ? data.type : 'reply',
                    chunk: typeof data.chunk === 'string' ? data.chunk : '',
                    data: 'data' in data ? data.data : undefined,
                };
            }

            function renderAgentSignal(data) {
                const signal = normalizeAgentSignal(data);
                appendDebugEntry('signal', `signal.${signal.type}`, signal);
                signalPill.textContent = signal.type;
                if (signal.type === 'reply') {
                    appendAgentDelta(signal.chunk);
                    return;
                }
                if (signal.type === 'done') {
                    finishAgentStream();
                    return;
                }
                if (signal.type === 'tool_start') {
                    addMessage(`工具开始: ${signal.chunk || 'unknown'}\n${signalDetail(signal)}`.trim(), 'system');
                    return;
                }
                if (signal.type === 'tool_result') {
                    addMessage(`工具结果: ${signal.chunk || 'unknown'}\n${signalDetail(signal)}`.trim(), 'system');
                    return;
                }
                if (signal.type === 'llm_turn') {
                    addMessage(`LLM 返回: ${signal.data?.stopReason ?? 'unknown'}\n${signalDetail(signal)}`.trim(), 'system');
                    return;
                }
                if (signal.chunk.length > 0 || signal.data !== undefined) {
                    addMessage(`${signal.type}: ${signalDetail(signal) || signal.chunk}`, 'system');
                }
            }

            function finishAgentStream() {
                if (currentAgentMessage && currentAgentMessage.textContent.trim().length === 0) {
                    currentAgentMessage.remove();
                    messageTotal = Math.max(0, messageTotal - 1);
                    updateStats();
                } else if (currentAgentMessage) {
                    currentAgentMessage.classList.remove('pending');
                }
                pending = false;
                currentAgentMessage = null;
                setStreamState(false);
                setInputEnabled(ws && ws.readyState === WebSocket.OPEN);
                messageInput.focus();
            }

            function cancelPendingMessage() {
                if (currentAgentMessage && currentAgentMessage.textContent.trim().length === 0) {
                    currentAgentMessage.remove();
                    messageTotal = Math.max(0, messageTotal - 1);
                    updateStats();
                } else if (currentAgentMessage) {
                    currentAgentMessage.classList.remove('pending');
                }
                pending = false;
                currentAgentMessage = null;
                setStreamState(false);
                setInputEnabled(ws && ws.readyState === WebSocket.OPEN);
            }

            function setStatus(mode, text) {
                status.className = `status-card ${mode}`;
                statusText.textContent = text;
            }

            function setStreamState(active) {
                streamState.classList.toggle('active', active);
                streamText.textContent = active ? 'streaming' : 'idle';
                if (!active) signalPill.textContent = 'ready';
            }

            function setInputEnabled(enabled) {
                sendBtn.disabled = !enabled;
                messageInput.disabled = !enabled;
                workingDirectoryInput.disabled = !enabled;
                cwdConfirmBtn.disabled = !enabled;
                document.querySelectorAll('.quick-btn').forEach((button) => {
                    button.disabled = !enabled;
                });
            }

            function updateStats() {
                messageCount.textContent = String(messageTotal);
                chunkCount.textContent = String(chunkTotal);
                packetCount.textContent = String(packetTotal);
                errorCount.textContent = String(errorTotal);
            }

            function handlePacket(msg) {
                packetTotal += 1;
                updateStats();
                appendDebugEntry('packet', `packet.${String(msg.action)}`, msg.data);
                if (msg.action === 'data') {
                    renderAgentSignal(msg.data);
                    return;
                }
                if (msg.action === 'streamEnd') {
                    finishAgentStream();
                    return;
                }
                if (msg.action === 'agent') {
                    renderAgentSignal(msg.data);
                    finishAgentStream();
                    return;
                }
                if (msg.action === 'open') {
                    setStatus('connected', '已连接');
                    addMessage('内核 IPC 已连接', 'system');
                    return;
                }
                if (msg.action === 'error') {
                    errorTotal += 1;
                    updateStats();
                    cancelPendingMessage();
                    addMessage(`错误: ${String(msg.data ?? '')}`, 'error');
                    return;
                }
                addMessage(`收到: ${JSON.stringify(msg)}`, 'system');
            }

            function debugIpc(event, detail) {
                if (!IPC_DEBUG) return;
                if (detail === undefined) console.debug(`[IPC/browser] ${event}`);
                else console.debug(`[IPC/browser] ${event}`, detail);
                appendDebugEntry('ipc', event, detail);
            }

            function previewText(value, max = 160) {
                const clean = String(value).replaceAll('\0', '\\0');
                return clean.length > max ? `${clean.slice(0, max)}...` : clean;
            }

            function charCodes(value, max = 32) {
                return Array.from(String(value).slice(0, max), (char) => char.charCodeAt(0));
            }

            function appendDebugEntry(kind, title, detail) {
                if (!debugLog) return;
                const entry = document.createElement('article');
                entry.className = `debug-entry ${kind}`;

                const head = document.createElement('div');
                head.className = 'debug-entry-head';
                head.textContent = title;

                const body = document.createElement('pre');
                body.className = 'debug-entry-body';
                body.textContent = formatDebugDetail(detail);

                entry.append(head, body);
                debugLog.appendChild(entry);
                while (debugLog.children.length > 80) {
                    debugLog.removeChild(debugLog.firstElementChild);
                }
                debugLog.scrollTop = debugLog.scrollHeight;
            }

            function formatDebugDetail(detail) {
                if (detail === undefined) return '';
                if (typeof detail === 'string') return previewText(detail, 800);
                try {
                    return previewText(JSON.stringify(detail, null, 2), 1200);
                } catch (error) {
                    return previewText(error instanceof Error ? error.message : String(detail), 800);
                }
            }

            function signalDetail(signal) {
                const lines = [];
                if (signal.data !== undefined) lines.push(formatDebugDetail(signal.data));
                if (signal.chunk.length > 0 && signal.type !== 'reply') lines.unshift(signal.chunk);
                return lines.filter(Boolean).join('\n');
            }

            async function readSocketMessage(eventData) {
                if (typeof eventData === 'string') {
                    debugIpc('ws.in', {
                        type: 'string',
                        chars: eventData.length,
                        preview: previewText(eventData),
                        charCodes: charCodes(eventData),
                    });
                    try {
                        return [JSON.parse(eventData)];
                    } catch (error) {
                        debugIpc('ws.in.json-error', {
                            message: error instanceof Error ? error.message : String(error),
                            preview: previewText(eventData),
                            charCodes: charCodes(eventData),
                        });
                        throw error;
                    }
                }
                debugIpc('ws.in', {
                    type: eventData?.constructor?.name ?? typeof eventData,
                });
                throw new Error('WebSocket bridge 只支持 JSON 文本消息');
            }

            function sendUserMessage(text) {
                if (!text || !ws || pending || ws.readyState !== WebSocket.OPEN) return;
                pending = true;
                setInputEnabled(false);
                const packet = { action: 'user', data: { text } };
                debugIpc('ws.out', {
                    action: packet.action,
                    textLength: text.length,
                });
                ws.send(JSON.stringify(packet));
                addMessage(text, 'user');
                createPendingAgentMessage();
            }

            function sendWorkingDirectory() {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                const path = workingDirectoryInput.value.trim();
                if (!path) {
                    addMessage('执行目录为空，未提交', 'error');
                    return;
                }
                const packet = { action: 'cwd', data: { path } };
                debugIpc('ws.out', packet);
                ws.send(JSON.stringify(packet));
                addMessage(`执行目录已提交: ${path}`, 'system');
            }

            function connect() {
                if (ws && ws.readyState !== WebSocket.CLOSED) return;
                setStatus('connecting', '连接中');
                connectBtn.disabled = true;
                ws = new WebSocket(BRIDGE_URL);

                ws.onopen = () => {
                    setStatus('connecting', '等待握手');
                    disconnectBtn.disabled = false;
                    clearBtn.disabled = false;
                    quickActions.hidden = false;
                    setInputEnabled(true);
                    addMessage('WebSocket bridge 已连接', 'system');
                };

                ws.onmessage = async (event) => {
                    try {
                        for (const packet of await readSocketMessage(event.data)) handlePacket(packet);
                    } catch (error) {
                        errorTotal += 1;
                        updateStats();
                        addMessage(`解析错误: ${error instanceof Error ? error.message : String(error)}`, 'error');
                    }
                };

                ws.onclose = () => {
                    setStatus('disconnected', '未连接');
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    clearBtn.disabled = false;
                    quickActions.hidden = true;
                    cancelPendingMessage();
                    setInputEnabled(false);
                    addMessage('WebSocket 已断开', 'system');
                    ws = null;
                };

                ws.onerror = () => {
                    addMessage('连接错误: WebSocket 连接失败', 'error');
                };
            }

            connectBtn.addEventListener('click', connect);
            cwdConfirmBtn.addEventListener('click', sendWorkingDirectory);

            disconnectBtn.addEventListener('click', () => {
                if (ws) ws.close();
            });

            clearBtn.addEventListener('click', () => {
                currentAgentMessage = null;
                pending = false;
                messageTotal = 0;
                chunkTotal = 0;
                packetTotal = 0;
                errorTotal = 0;
                updateStats();
                setStreamState(false);
                renderEmptyState();
                setInputEnabled(ws && ws.readyState === WebSocket.OPEN);
            });

            composer.addEventListener('submit', (event) => {
                event.preventDefault();
                const text = messageInput.value.trim();
                if (!text) return;
                sendUserMessage(text);
                messageInput.value = '';
            });

            document.querySelectorAll('.quick-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    const text = button.getAttribute('data-msg') ?? '';
                    sendUserMessage(text);
                });
            });
        </script>
    </body>
</html>
